[workspace]
members = ["crates/symvault-cli", "crates/symvault-core", "crates/symvault-crypto"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/danieljustus/symaira-vault"

[workspace.dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
symaira-core-version = { version = "=0.0.0", git = "https://github.com/danieljustus/symaira-corekit", rev = "27177f25f551cecefa7bd6c4524abf175b3a75c7", package = "symaira-core-version" }
symvault-core = { path = "crates/symvault-core", version = "=0.0.0" }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
