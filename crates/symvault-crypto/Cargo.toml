[package]
name = "symvault-crypto"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
age = { version = "=0.12.1", default-features = false }
age-core = { version = "=0.12.0", default-features = false }
argon2 = { path = "../../third_party/argon2", version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "=0.4.3"
base64 = "=0.23.1"
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "=0.13.0"
hmac = "=0.13.0"
sha2 = "=0.11.1"
zeroize = { version = "=1.9.1", features = ["alloc", "derive"] }

[dev-dependencies]
hex = "=0.4.3"
proptest = "=1.12.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[features]
default = []
