[package]
name = "symvault-sync"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
symvault-core.workspace = true
url = "=2.5.8"
base64 = "=0.22.1"
csv = "=1.4.0"
flate2 = "=1.1.5"
getrandom = "=0.3.3"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "=0.10.9"
rustix = { version = "=1.1.4", features = ["fs"] }
symvault-crypto = { path = "../symvault-crypto", version = "=0.0.0" }
symvault-gojson = { path = "../symvault-gojson", version = "=0.0.0" }
symvault-store = { path = "../symvault-store", version = "=0.0.0" }
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=1.0.69"
time = { version = "=0.3.47", features = ["formatting", "local-offset", "parsing"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
