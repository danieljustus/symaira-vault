[package]
name = "symvault-mcp"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
getrandom = "=0.3.3"
serde.workspace = true
symvault-gojson = { path = "../symvault-gojson", version = "=0.0.0" }
serde_json = { workspace = true, features = ["raw_value"] }
# Go 1.26 selects Unicode 15 tables; ICU 2.3 normalizes newer codepoints differently.
unicode-normalization = "=0.1.22"

[dev-dependencies]
sha2 = "=0.10.9"
