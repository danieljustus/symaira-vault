# Stripe API template.
# Auth shape: Authorization: Bearer <sk_...> — https://docs.stripe.com/api/authentication
# Fill the vault entry referenced by entry_ref with a "credential" field.
base_url: https://api.stripe.com/v1
auth_type: bearer
entry_ref: op:///stripe
allowed_endpoints:
  - /charges/*
  - /payment_intents/*
  - /customers/*
  - /products/*
  - /prices/*
allowed_methods:
  - GET
  - POST
