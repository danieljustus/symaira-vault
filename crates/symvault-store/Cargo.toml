[package]
name = "symvault-store"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
symvault-core.workspace = true
base64 = "=0.23.1"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value", "unbounded_depth"] }
hex = "=0.4.3"
serde_yaml_ng = "=0.10.0"
sha2 = "=0.11.1"
hmac = "=0.13.0"
getrandom = "=0.4.3"
rustix = { version = "=1.1.5", features = ["fs"] }
symvault-crypto = { path = "../symvault-crypto", version = "=0.0.0" }
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
walkdir = "=2.5.0"
zeroize = { version = "=1.9.1", features = ["alloc"] }

[features]
# `data_safety::test_support_pre_marked` for fixtures. Enabled only through
# dev-dependencies; no production build turns it on.
test-support = []

[dev-dependencies]
symvault-store = { path = ".", features = ["test-support"] }
base64 = "=0.23.1"
tempfile = "=3.27.0"
