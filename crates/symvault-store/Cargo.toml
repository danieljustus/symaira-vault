[package]
name = "symvault-store"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
symvault-core.workspace = true
base64 = "=0.23.1"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "=0.10.0"
sha2 = "=0.10.9"
hmac = "=0.12.1"
getrandom = "=0.4.3"
fs4 = { version = "=0.13.1", features = ["sync"] }
rustix = { version = "=1.1.5", features = ["fs"] }
symvault-crypto = { path = "../symvault-crypto", version = "=0.0.0" }
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting", "parsing"] }
walkdir = "=2.5.0"
zeroize = { version = "=1.9.1", features = ["alloc"] }

[dev-dependencies]
base64 = "=0.23.1"
tempfile = "=3.27.0"
