[package]
name = "symvault-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "symvault"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
clap.workspace = true
clap_complete = "=4.6.9"
clap_mangen = "=0.2.33"
flate2 = "=1.1.5"
getrandom = "=0.3.3"
hmac = "=0.12.1"
tar = "=0.4.46"
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
signal-hook = { version = "=0.3.18", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde_yaml_ng = "=0.10.0"
yaml-edit = { version = "=0.3.1", default-features = false }
rpassword = "=7.5.4"
symaira-core-version.workspace = true
symvault-core.workspace = true
symvault-gojson = { path = "../symvault-gojson", version = "=0.0.0" }
time = { version = "=0.3.47", features = ["formatting", "parsing"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
symvault-platform = { path = "../symvault-platform", version = "=0.0.0" }
symvault-crypto = { path = "../symvault-crypto", version = "=0.0.0" }
symvault-mcp = { path = "../symvault-mcp", version = "=0.0.0" }
symvault-store = { path = "../symvault-store", version = "=0.0.0" }
symvault-sync = { path = "../symvault-sync", version = "=0.0.0" }
url = "=2.5.8"
zeroize = { version = "=1.8.2", features = ["alloc"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["event", "process", "termios"] }
