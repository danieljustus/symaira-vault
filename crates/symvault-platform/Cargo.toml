[package]
name = "symvault-platform"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
base64 = "=0.23.1"
symvault-core.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
keyring-core = "=1.0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "termios"] }
signal-hook = "=0.4.5"

[dev-dependencies]
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
# One SetConsoleCtrlHandler routine for `get`'s Ctrl-C/Ctrl-Break/close clear.
# Same pin as symvault-cli, which uses it in other commands only.
ctrlc = { version = "=3.5.2", features = ["termination"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
arboard = { version = "=3.7.0", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
tempfile = "=3.27.0"
