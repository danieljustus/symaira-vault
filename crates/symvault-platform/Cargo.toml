[package]
name = "symvault-platform"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde_json.workspace = true
base64 = "=0.23.1"
symvault-core.workspace = true
zeroize = { version = "=1.9.1", features = ["alloc"] }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
keyring = { version = "=4.2.0", default-features = false, features = ["v1"] }
keyring-core = "=1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false, features = ["OSX_10_15"] }
# LocalAuthentication through the Objective-C runtime (native Touch ID prompt
# attributed to the signed binary). Both already ship via ctrlc -> dispatch2.
objc2 = "=0.6.4"
block2 = "=0.6.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process", "termios"] }
signal-hook = "=0.4.6"

[dev-dependencies]
serde.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
tempfile = "=3.27.0"
