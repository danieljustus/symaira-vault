repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(age|md)$'
      - id: end-of-file-fixer
        exclude: '\.(age)$'
      - id: check-yaml
        exclude: 
          - ".*\\.age$"
      - id: check-json
        exclude: 
          - ".*\\.age$"
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-case-conflict

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'make rust-lint'
        language: system
        files: \.(rs|toml)$
        pass_filenames: false
