version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - danieljustus
    commit-message:
      prefix: "chore(ci)"
    groups:
      # init, autobuild, analyze and upload-sarif must run the same version:
      # a split bump (init 4.39.1, analyze 4.39.2) failed every CodeQL job
      # with a configuration error.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - danieljustus
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 0.1.22 has Unicode 15 tables, 0.1.25 already Unicode 17; the frozen Go
      # oracle normalizes with Unicode 15, so newer tables break MCP/doctor
      # parity (see #1421/#1434).
      - dependency-name: "unicode-normalization"
        versions: [">0.1.22"]
