version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - danieljustus
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns:
          - "*"
    ignore:
      # Deferred: transitive via go-git — tracked in deferred-deps-check.yml
      - dependency-name: "github.com/ProtonMail/go-crypto"
      # Deferred: transitive via groupcache — tracked in deferred-deps-check.yml
      - dependency-name: "github.com/golang/protobuf"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - danieljustus
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - danieljustus
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 0.3.2 emits nested block scalars as `- >2-`, breaking the Go config
      # oracle (config_cases_match_go_generated_contract). Tracked in #1433.
      - dependency-name: "yaml-edit"
        versions: ["0.3.2"]
