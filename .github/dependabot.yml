version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - danieljustus
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    reviewers:
      - danieljustus
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 0.1.22 has Unicode 15 tables, 0.1.25 already Unicode 17; the frozen Go
      # oracle normalizes with Unicode 15, so newer tables break MCP/doctor
      # parity (see #1421/#1434).
      - dependency-name: "unicode-normalization"
        versions: [">0.1.22"]
