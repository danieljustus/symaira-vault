name: Rust absolute HTTP write deadlines

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-http-write.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'scripts/rust-port/http_head_contract.py'
      - 'scripts/rust-port/http_framing_contract.py'
      - 'scripts/rust-port/http_slow_peer_contract.py'
      - 'scripts/rust-port/http_timeout_contract.py'
      - 'scripts/rust-port/http_tls_contract.py'
      - 'scripts/rust-port/http_tls_identity.go.txt'
      - 'scripts/rust-port/http_write_contract.py'
      - 'scripts/rust-port/http_write_mutation.py'
      - 'scripts/rust-port/test_http_write_contract.py'
      - 'scripts/rust-port/http_winsock_metadata.py'
      - 'scripts/rust-port/http_winsock_stop.cpp'
      - 'scripts/rust-port/http_oauth*'
      - 'scripts/rust-port/http_process*'
      - 'scripts/rust-port/mcp_process_contract.py'
      - 'docs/adr/0027-absolute-http-write-deadlines.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  write:
    name: Absolute HTTP write deadlines (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in rust-http-macos.yml as one consolidated GitHub-hosted job.
        os: [ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      RUST_TEST_THREADS: '1'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout candidate and frozen observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test owning runtime and CLI assembly
        run: |
          set -euo pipefail
          python3 scripts/rust-port/test_http_write_contract.py
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-write-tests.txt 2>&1 || { cat target/native-write-tests.txt; exit 1; }
          cat target/native-write-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-write-tests.txt keep_alive_idle_timeout_matches_go_source_and_closes_socket --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --bin symvault --locked mcp_commands::tests > target/native-write-cli-owner.txt 2>&1 || { cat target/native-write-cli-owner.txt; exit 1; }
          cat target/native-write-cli-owner.txt
          python3 - <<'OWNER'
          import re
          from pathlib import Path
          text=Path('target/native-write-cli-owner.txt').read_text()
          rows=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert rows and sum(int(n) for n,_ in rows)>0 and all(int(i)==0 for _,i in rows)
          OWNER
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Verify actual TLS backpressure and reject a disabled deadline
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 -B scripts/rust-port/http_write_contract.py --rust "$rust_cli" --receipt target/native-tls-output.json --tls-output-probe-only
          python3 -B scripts/rust-port/http_write_mutation.py --rust "$rust_cli" --receipt target/native-tls-output-mutation.json
          git diff --exit-code -- crates/symvault-mcp/src/http.rs
      - name: Execute actual native absolute writes and separate TLS admission
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_write_contract.py --rust "$rust_cli" --receipt target/native-http-write.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-write.json --profile http-write
      - name: Retain complete actual native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: http-write-${{ matrix.os }}
          path: |
            target/native-http-write.json
            target/native-tls-output.json
            target/native-tls-output-mutation.json
            target/native-tls-output-mutation.mutant.json
            target/native-write-tests.txt
            target/native-write-cli-owner.txt
            target/native-oracle-process-tests.txt
            target/native-winsock-metadata.json
            target/native-winsock-schema.json
            target/native-winsock-loss.json
          if-no-files-found: error
