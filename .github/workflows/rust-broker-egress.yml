name: Rust egress broker

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-broker-egress.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'testdata/**'
      - 'third_party/**'
      - 'internal/mcp/apitemplates/builtin/**'
      - 'scripts/rust-port/cmd/cligap/**'
      - 'scripts/rust-port/egress_contract*'
      - 'scripts/rust-port/http_tls_identity.go.txt'
      - 'docs/adr/0015-egress-broker-runtime-boundaries.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  egress:
    name: Egress broker (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      SYMVAULT_TEST_KEYRING: memory
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout retained source and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Execute actual native TLS and lifetime regressions
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp -p symvault-core --all-targets --locked -- -D warnings
          cargo test -p symvault-core --test policy_contract --locked bounded_network_globs_match_captured_go_unicode_and_escape_cases
          cargo test -p symvault-mcp --test egress_broker --locked > target/native-egress-tests.txt 2>&1 || { cat target/native-egress-tests.txt; exit 1; }
          cat target/native-egress-tests.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('target/native-egress-tests.txt').read_text()
          assert '5 passed; 0 failed; 0 ignored' in text
          for case in ['egress_preflight_denies_before_credential_read_or_upstream_contact', 'egress_decoded_path_acl_denies_before_entry_read_or_normalization', 'egress_verified_mitm_injects_and_masks_real_encrypted_credentials', 'egress_callback_error_joins_idle_clients_and_releases_listener', 'egress_stop_cancels_owned_upstream_request_without_waiting_for_network_timeout']:
              assert f'{case} ... ok' in text
          PY
          cargo build -p symvault-cli --bin symvault -p symvault-mcp --example egress_contract_probe --locked
      - name: Execute actual native Go and Rust CLI and runtime cases
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          rust_probe=target/debug/examples/egress_contract_probe
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; rust_probe+=.exe; fi
          python3 scripts/rust-port/egress_contract.py --rust-cli "$rust_cli" --rust-probe "$rust_probe" --receipt native-egress.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('native-egress.json').read_bytes())
          assert receipt['passed'] and receipt['candidate_worktree_clean'] and receipt['candidate_worktree_clean_at_end']
          assert receipt['candidate_commit'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert receipt['native_os'] in {'Linux','Darwin','Windows'}
          runtime = {'tls-auth-bearer','tls-auth-basic','tls-auth-header','tls-auth-query_param','tls-auth-none','tls-all-substitution-surfaces','method-denied','endpoint-denied','encoded-endpoint-allowed','encoded-endpoint-denied','dot-segment-policy','unmatched-forwarded','unmatched-strict','passthrough-preserves-upstream-tls','untrusted-upstream-tls','template-port-binding','template-plaintext-binding','connect-inner-authority-binding','redirect-authority-binding'}
          cli = {'broker-missing-vault','broker-boolean-forms','run-broker-flags-reach-vault','run-broker-disabled','run-broker-public-env','run-broker-strict-passthrough','run-broker-child-error','run-broker-timeout','run-broker-explicit-env','run-broker-launch-error','standalone-broker','standalone-broker-flags','loopback-listener-policy','concurrent-broker-ca-isolation'}
          for implementation in ['go','rust']:
              assert runtime == {row['case'] for row in receipt[implementation]}
              assert cli == {row['case'] for row in receipt[implementation+'_cli']}
          PY
          go run ./scripts/rust-port/cmd/cligap --binary "$rust_cli" --output target/native-broker-gaps.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/native-broker-gaps.json').read_bytes())
          assert report['oracle_paths'] >= 134 and report['rust_paths'] >= 100
          for kind in ['missing_paths','flag_gaps','alias_gaps']:
              assert not any(gap['path'] in {'symvault broker','symvault run'} for gap in report[kind] or []), kind
          PY
      - name: Upload source-bound actual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: egress-broker-${{ matrix.os }}
          path: |
            native-egress.json
            target/native-egress-tests.txt
            target/native-broker-gaps.json
          if-no-files-found: error
          retention-days: 14
