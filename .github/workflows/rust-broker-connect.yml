name: Rust broker CONNECT

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-broker-connect.yml'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'scripts/rust-port/connect_contract*'
      - 'docs/adr/0014-connect-socket-and-relay-ownership.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connect:
    name: CONNECT (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      SYMVAULT_TEST_KEYRING: memory
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Execute four native socket regressions
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --lib --locked broker::connect::tests:: > target/native-connect-tests.txt 2>&1
          cat target/native-connect-tests.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('target/native-connect-tests.txt').read_text()
          assert '4 passed; 0 failed; 0 ignored' in text
          for case in ['accepted_socket_reset_preserves_delayed_payload', 'connect_passthrough_tunnels_only_allowlisted_loopback_hosts', 'stopping_joins_idle_relay_and_closes_upstream', 'private_and_unlisted_targets_do_not_connect_upstream']:
              assert f'{case} ... ok' in text
          PY
          cargo build -p symvault-mcp --example connect_contract_probe --locked
      - name: Execute actual native Go and Rust CONNECT transcripts
        run: |
          set -euo pipefail
          rust_binary=target/debug/examples/connect_contract_probe
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_binary=target/debug/examples/connect_contract_probe.exe; fi
          python3 scripts/rust-port/connect_contract.py --rust "$rust_binary" --receipt native-connect.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('native-connect.json').read_bytes())
          assert receipt['passed'] and receipt['candidate_worktree_clean']
          assert receipt['candidate_commit'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert receipt['native_os'] in {'Linux','Darwin','Windows'}
          for implementation in ['go','rust']:
              assert {row['case'] for row in receipt[implementation]} == {'ordinary','delayed','fragmented-binary'}
          PY
      - name: Upload actual native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: broker-connect-${{ matrix.os }}
          path: |
            native-connect.json
            target/native-connect-tests.txt
          if-no-files-found: error
          retention-days: 14
