name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  decide:
    name: Select macOS capacity
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/macos-runner.yml
    with:
      # Same hosted image main uses; macos-latest ships an older Xcode whose
      # actool crashes on the Icon Composer assets.
      hosted: xcode-27
    secrets:
      RUNNER_INVENTORY_TOKEN: ${{ secrets.RUNNER_INVENTORY_TOKEN }}

  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.areas.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Test the path table
        run: ./scripts/test-ci-changed-areas.sh

      - name: Map changed paths to jobs
        id: areas
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Only pull requests are path-gated; push, schedule and dispatch run everything.
          if [ "$EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for ref in "$BASE_SHA" "$HEAD_SHA"; do
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${ref}^{commit}"; then
              echo "::error::Pull request base/head commit is invalid or unavailable: $ref" >&2
              exit 1
            fi
          done
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" \
            | ./scripts/ci-changed-areas.sh | tee -a "$GITHUB_OUTPUT"

  # ── Always-run jobs (PR + main) ──────────────────────────────────────────
  dependency-scan:
    name: Dependency Scan
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV Scanner
        id: osv_scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: >-
            --lockfile=Cargo.lock
            --config=osv-scanner.toml
            --format=sarif
            --output=osv-results.sarif

      - name: Upload OSV SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: osv-results.sarif

      # osv-scanner-action's process exit code has been observed to be
      # nonzero even when every finding is explicitly ignored via
      # osv-scanner.toml and the uploaded SARIF (the actual GitHub Security
      # tab signal) contains zero results, so the job's pass/fail is decided
      # from the SARIF content itself rather than the raw scanner exit code.
      - name: Fail on unignored OSV findings
        if: always()
        run: |
          if [ ! -f osv-results.sarif ]; then
            echo "osv-results.sarif was not produced; treating as a scanner failure."
            exit 1
          fi
          count=$(jq '[.runs[].results[]?] | length' osv-results.sarif)
          echo "Findings remaining after osv-scanner.toml ignores: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]? | "\(.ruleId): \(.message.text)"' osv-results.sarif
            exit 1
          fi
          if [ "${{ steps.osv_scan.outcome }}" != "success" ]; then
            echo "Note: OSV Scanner's own exit code (${{ steps.osv_scan.outcome }}) was non-zero, but the uploaded SARIF has zero findings after ignores; not failing the job on that alone."
          fi

  lint:
    name: Lint
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # Job id and display name are kept: they are a required status check. The flake
  # builds the Rust CLI from Cargo.lock (rustPlatform.buildRustPackage); there is
  # no vendorHash to verify any more.
  flake-vendorhash:
    name: Flake vendorHash
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build and run Nix flake
        run: |
          nix --extra-experimental-features 'nix-command flakes' build .#
          nix --extra-experimental-features 'nix-command flakes' run .# -- version

  port-contract:
    name: Rust port contract
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify frozen Go observations and differential harness (replay)
        run: make port-contract

  rust:
    name: Rust
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview

      - name: Install Rust verification tools
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.143,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-hack@0.6.45,cargo-llvm-cov@0.9.0
          fallback: none

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # The interpreter-heavy Miri pass runs in the parallel `rust-miri` job;
      # `rust-gates-core` is every remaining staged gate.
      - name: Run Rust gates and replayed differential contract
        run: make rust-gates-core

      - name: Verify real Unix MCP approval terminal
        run: make mcp-approval-pty-acceptance

  rust-miri:
    name: Rust Miri
    needs: [changes]
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Install pinned nightly Miri toolchain
        run: rustup toolchain install nightly-2026-09-03 --profile minimal --component miri,rust-src

      - name: Run symvault-core tests under Miri
        run: make rust-miri

  rust-fuzz:
    name: Rust fuzz (main/schedule)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust fuzz toolchain
        run: rustup toolchain install nightly-2026-09-03 --profile minimal --component rust-src

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded main/scheduled Rust fuzz pass
        run: make rust-fuzz

  # Keep native Rust in the PR run so migration batches need no duplicate
  # workflow_dispatch of the entire CI matrix.
  rust-native:
    name: Rust native (${{ matrix.os }})
    needs: [changes, decide]
    if: needs.changes.outputs.code != 'false'
    runs-on: ${{ fromJSON(matrix.os == 'macos-latest' && needs.decide.outputs.runs_on || toJSON(matrix.os)) }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          persist-credentials: false
          # store004 provenance digests read the pinned oracle commit with
          # `git show`; a shallow checkout does not contain it.
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      # Clippy checks the same targets; cargo test already includes doctests.
      - name: Check and lint
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify MCP handler fixtures (replay)
        shell: bash
        run: make mcp-call-fixtures-check

      - name: Test including doctests
        shell: bash
        env:
          # The MacBook runner runs in its own security session (SessionCreate)
          # and must not create keychains on the operator's machine; the
          # keychain-native job below runs this test on a hosted runner.
          SKIP_KEYCHAIN: ${{ runner.environment == 'self-hosted' && '--skip security_framework_items_match_go_layout_on_disposable_keychains' || '' }}
        run: |
          # shellcheck disable=SC2086 # intentionally empty or two words
          cargo test --workspace --all-features --locked -- $SKIP_KEYCHAIN

      - name: Verify CLI and authentication parity (replay)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # The trusted-alias auth case needs TMPDIR below the root-owned
          # /var -> /private/var alias; the self-hosted runner's .env points
          # TMPDIR at an external volume, so use the per-user macOS temp dir.
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            TMPDIR="$(getconf DARWIN_USER_TEMP_DIR)"
            export TMPDIR
          fi
          make config-cli-differential

      - name: Verify real Unix MCP approval terminal
        shell: bash
        run: make mcp-approval-pty-acceptance

  keychain-native:
    name: Keychain native (macOS, hosted)
    needs: [changes, decide]
    # Runs only when rust-native went to the self-hosted runner, which skips it.
    if: needs.changes.outputs.code != 'false' && contains(needs.decide.outputs.runs_on, 'self-hosted')
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Disposable keychain parity
        run: cargo test --locked -p symvault-platform --test native_biometric_item -- --exact security_framework_items_match_go_layout_on_disposable_keychains

  # ── PR-fast jobs ─────────────────────────────────────────────────────────
  build-pr:
    name: Build (linux-amd64) — PR
    if: github.event_name == 'pull_request' && needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    needs: [changes, lint, dependency-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build binary
        env:
          SYMVAULT_VERSION: dev
        run: |
          cargo build --release --locked -p symvault-cli --bin symvault
          cp target/release/symvault symvault-linux-amd64

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: symvault-linux-amd64
          path: symvault-linux-amd64
          retention-days: 1

  macos-vaultcore:
    name: Vaultcore (macOS)
    needs: [ubuntu-editors]
    if: >-
      github.event_name == 'pull_request' &&
      needs.ubuntu-editors.outputs.client_changed != 'false'
    # Stays hosted: its Swift tests store Keychain items, which the self-hosted
    # runner's isolated security session (SessionCreate) cannot do.
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: ${{ runner.environment != 'self-hosted' }}
          persist-credentials: false
          fetch-depth: 0

      - name: Require Xcode 26 or newer for native icon builds
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '$1 == "Xcode" && !seen { split($2, v, "."); print v[1]; seen = 1 }')"
          if [ -z "$XCODE_MAJOR" ] || [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::Icon Composer .icon builds require Xcode 26 or newer (found: ${XCODE_MAJOR:-unknown})"
            exit 1
          fi

      - name: Set up Rust (pinned toolchain + Apple targets for SymvaultFFI)
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal \
            --target aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim
          rustc --version

      - name: Build Vaultcore framework (Rust SymvaultFFI XCFramework)
        run: scripts/build-vaultcore.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build native Vault apps and verify icons
        run: |
          set -euo pipefail
          cargo build --release --locked -p symvault-cli --bin symvault
          cp target/release/symvault symvault
          xcodegen --spec client/project.yml --project client
          scripts/verify-vault-icon.sh --source-only

          MACOS_ARCHIVE="$RUNNER_TEMP/Symvault.xcarchive"
          xcodebuild -project client/Symvault.xcodeproj \
            -scheme Symvault \
            -configuration Release \
            -archivePath "$MACOS_ARCHIVE" \
            archive \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          scripts/verify-vault-icon.sh --bundle \
            "$MACOS_ARCHIVE/Products/Applications/Symaira Vault.app"

          IOS_DERIVED_DATA="$RUNNER_TEMP/SymvaultIOSDerivedData"
          xcodebuild -project client/Symvault.xcodeproj \
            -scheme SymvaultIOSApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          scripts/verify-vault-icon.sh --bundle \
            "$IOS_DERIVED_DATA/Build/Products/Release-iphonesimulator/Symaira Vault.app"

      - name: Swift build
        working-directory: client
        run: swift build

      - name: Swift test
        working-directory: client
        run: swift test

  ubuntu-editors:
    name: Editors (Ubuntu)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      client_changed: ${{ steps.path-check.outputs.client_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if editors/** or Vaultcore inputs changed
        id: path-check
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="${BASE_SHA:-}"
          HEAD_SHA="${HEAD_SHA:-}"
          for ref in "$BASE_SHA" "$HEAD_SHA"; do
            if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Pull request base/head must be a full 40-character commit SHA" >&2
              exit 1
            fi
          done
          for ref in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${ref}^{commit}"; then
              echo "::error::Pull request commit is unavailable: $ref" >&2
              exit 1
            fi
          done

          changed_paths="$(mktemp "${RUNNER_TEMP}/vault-ci-changed-paths.XXXXXX")"
          trap 'rm -f "$changed_paths"' EXIT
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"

          editors_changed=false
          client_changed=false
          while IFS= read -r -d '' path; do
            if [[ "$path" == editors/* ]]; then
              editors_changed=true
            fi
            if [[ "$path" == client/* ||
                  "$path" == assets/branding/* ||
                  "$path" == scripts/build-vaultcore.sh ||
                  "$path" == scripts/rust-port/build-ffi-xcframework.sh ||
                  "$path" == crates/* ||
                  "$path" == Cargo.toml ||
                  "$path" == Cargo.lock ||
                  "$path" == rust-toolchain.toml ||
                  "$path" == scripts/verify-vault-icon.sh ||
                  "$path" == .github/workflows/ci.yml ||
                  "$path" == .github/workflows/release.yml ]]; then
              client_changed=true
            fi
          done < "$changed_paths"

          printf 'run=%s\nclient_changed=%s\n' "$editors_changed" "$client_changed" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.path-check.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/package-lock.json

      - name: Install dependencies
        if: steps.path-check.outputs.run == 'true'
        working-directory: editors
        run: npm ci

      - name: Build editors
        if: steps.path-check.outputs.run == 'true'
        working-directory: editors
        run: npm run build

      - name: Test editors
        if: steps.path-check.outputs.run == 'true'
        working-directory: editors
        run: npm test

  # ── Main / schedule only jobs ────────────────────────────────────────────
  build:
    name: Build
    if: github.event_name != 'pull_request'
    needs: [lint, dependency-scan]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build binary
        env:
          SYMVAULT_VERSION: dev
        run: |
          output_name="symvault-${{ matrix.goos }}-${{ matrix.goarch }}"
          cargo build --release --locked -p symvault-cli --bin symvault
          cp target/release/symvault "$output_name"
          echo "Built: $output_name"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: symvault-${{ matrix.goos }}-${{ matrix.goarch }}
          path: symvault-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 7

  smoke-test:
    name: Binary Smoke Test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download linux-amd64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: symvault-linux-amd64
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/symvault-linux-amd64

      - name: Smoke test - help flag
        run: ./bin/symvault-linux-amd64 --help

      - name: Smoke test - subcommand help pages
        run: |
          ./bin/symvault-linux-amd64 get --help
          ./bin/symvault-linux-amd64 set --help
          ./bin/symvault-linux-amd64 list --help
          ./bin/symvault-linux-amd64 serve --help

      - name: Smoke test - vault operations
        run: |
          BIN="./bin/symvault-linux-amd64"
          VAULT_DIR=$(mktemp -d)
          PASSPHRASE="test-passphrase-123"
          export SYMVAULT_ALLOW_ENV_PASSPHRASE=1

          echo "Testing vault initialization..."
          SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN init "$VAULT_DIR"

          echo "Testing entry creation..."
          SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN --vault "$VAULT_DIR" set "test.entry" --value "test-value-456"

          echo "Testing entry retrieval..."
          OUTPUT=$(SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN --vault "$VAULT_DIR" get "test.entry")
          if [ "$OUTPUT" != "test-value-456" ]; then
            echo "ERROR: Expected 'test-value-456', got '$OUTPUT'"
            exit 1
          fi
          echo "Entry retrieval successful"

          echo "Testing list command..."
          LIST_OUTPUT=$(SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN --vault "$VAULT_DIR" list)
          if ! echo "$LIST_OUTPUT" | grep -q "test"; then
            echo "ERROR: List output does not contain 'test'"
            exit 1
          fi
          echo "List command successful"

          echo "Testing find command..."
          FIND_OUTPUT=$(SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN --vault "$VAULT_DIR" find "test-value")
          if ! echo "$FIND_OUTPUT" | grep -q "test"; then
            echo "ERROR: Find output does not contain 'test'"
            exit 1
          fi
          echo "Find command successful"

          echo "Cleaning up test vault..."
          rm -rf "$VAULT_DIR"

          echo "All smoke tests passed!"

  # The PR gate is intentionally a separate, PR-only job. Main/schedule-only
  # jobs are not dependencies here because skipped jobs must not manufacture a
  # false PR prerequisite.
  ci-gate:
    name: CI Success
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - changes
      - decide
      - dependency-scan
      - lint
      - flake-vendorhash
      - port-contract
      - rust
      - rust-miri
      - rust-native
      - keychain-native
      - build-pr
      - macos-vaultcore
      - ubuntu-editors
    steps:
      - name: Regression-test gate result handling
        shell: bash
        run: |
          set -euo pipefail
          accepts() {
            case "$1" in success|skipped) return 0 ;; *) return 1 ;; esac
          }
          accepts success
          accepts skipped
          for result in failure cancelled pending; do
            if accepts "$result"; then
              echo "Gate regression: ${result} was incorrectly accepted" >&2
              exit 1
            fi
          done
          echo "Gate regression handling passed (success/skipped accepted; failure/cancelled/pending rejected)"

      - name: Verify applicable PR dependencies
        shell: bash
        env:
          RES_CHANGES: ${{ needs.changes.result }}
          RES_CODE_CHANGED: ${{ needs.changes.outputs.code }}
          RES_DEPENDENCY_SCAN: ${{ needs.dependency-scan.result }}
          RES_LINT: ${{ needs.lint.result }}
          RES_FLAKE_VENDORHASH: ${{ needs.flake-vendorhash.result }}
          RES_PORT_CONTRACT: ${{ needs.port-contract.result }}
          RES_RUST: ${{ needs.rust.result }}
          RES_RUST_MIRI: ${{ needs.rust-miri.result }}
          RES_RUST_NATIVE: ${{ needs.rust-native.result }}
          RES_KEYCHAIN_NATIVE: ${{ needs.keychain-native.result }}
          RES_KEYCHAIN_ROUTED: ${{ contains(needs.decide.outputs.runs_on, 'self-hosted') }}
          RES_BUILD_PR: ${{ needs.build-pr.result }}
          RES_MACOS_VAULTCORE: ${{ needs.macos-vaultcore.result }}
          RES_VAULTCORE_CLIENT_CHANGED: ${{ needs.ubuntu-editors.outputs.client_changed }}
          RES_UBUNTU_EDITORS: ${{ needs.ubuntu-editors.result }}
        run: |
          set -euo pipefail
          check_required() {
            local result="$1" label="$2"
            if [ "$result" != success ]; then
              echo "❌ ${label} (${result:-missing})" >&2
              exit 1
            fi
            echo "✅ ${label} (${result})"
          }
          check_path_gated() {
            local result="$1" label="$2"
            case "$result" in
              success|skipped) echo "✅ ${label} (${result})"; return 0 ;;
              *) echo "❌ ${label} (${result:-missing})" >&2; return 1 ;;
            esac
          }
          check_vaultcore() {
            local client_changed="$1" result="$2"
            case "$client_changed" in
              true)
                if [ "$result" != success ]; then
                  echo "❌ macos-vaultcore (${result:-missing}) despite client_changed=true" >&2
                  return 1
                fi
                echo "✅ macos-vaultcore (${result}; client_changed=true)"
                ;;
              false)
                check_path_gated "$result" macos-vaultcore
                ;;
              *)
                echo "❌ Vaultcore input classification (${client_changed:-missing}) is not true or false" >&2
                return 1
                ;;
            esac
          }
          # Only a confirmed code=false permits a skip; true/unknown/missing require success.
          check_code() {
            local code_changed="$1" result="$2" label="$3"
            case "$code_changed" in
              true) check_required "$result" "$label" ;;
              false) check_path_gated "$result" "$label" ;;
              *) echo "❌ ${label}: code classification (${code_changed:-missing}) is not true or false" >&2; exit 1 ;;
            esac
          }
          expect_code() {
            local expected="$1" code_changed="$2" result="$3" actual
            if (check_code "$code_changed" "$result" probe) >/dev/null 2>&1; then actual=accept; else actual=reject; fi
            if [ "$actual" != "$expected" ]; then
              echo "Gate regression: code=${code_changed:-missing}, result=${result:-missing} expected ${expected}, got ${actual}" >&2
              exit 1
            fi
          }
          expect_code accept true success
          expect_code reject true skipped
          expect_code reject true failure
          expect_code accept false skipped
          expect_code accept false success
          expect_code reject false failure
          expect_code reject false cancelled
          expect_code reject '' skipped
          expect_code reject unknown success
          echo "Code gate regression passed (only confirmed code=false permits a skip)"
          check_required "$RES_CHANGES" changes
          check_code "$RES_CODE_CHANGED" "$RES_DEPENDENCY_SCAN" dependency-scan
          check_code "$RES_CODE_CHANGED" "$RES_LINT" lint
          check_code "$RES_CODE_CHANGED" "$RES_FLAKE_VENDORHASH" flake-vendorhash
          check_code "$RES_CODE_CHANGED" "$RES_PORT_CONTRACT" port-contract
          check_code "$RES_CODE_CHANGED" "$RES_RUST" rust
          check_code "$RES_CODE_CHANGED" "$RES_RUST_MIRI" rust-miri
          check_code "$RES_CODE_CHANGED" "$RES_RUST_NATIVE" rust-native
          # keychain-native covers the one test rust-native skips on the self-hosted runner.
          if [ "$RES_KEYCHAIN_ROUTED" = true ]; then
            check_code "$RES_CODE_CHANGED" "$RES_KEYCHAIN_NATIVE" keychain-native
          else
            check_path_gated "$RES_KEYCHAIN_NATIVE" keychain-native
          fi
          check_code "$RES_CODE_CHANGED" "$RES_BUILD_PR" build-pr
          expect_vaultcore() {
            local expected="$1" client_changed="$2" result="$3" actual
            if check_vaultcore "$client_changed" "$result" >/dev/null 2>&1; then
              actual=accept
            else
              actual=reject
            fi
            if [ "$actual" != "$expected" ]; then
              echo "Gate regression: client_changed=${client_changed:-missing}, result=${result:-missing} expected ${expected}, got ${actual}" >&2
              exit 1
            fi
          }
          expect_vaultcore accept true success
          expect_vaultcore reject true skipped
          expect_vaultcore reject true failure
          expect_vaultcore accept false skipped
          expect_vaultcore accept false success
          expect_vaultcore reject false failure
          expect_vaultcore reject unknown success
          expect_vaultcore reject error skipped
          expect_vaultcore reject '' skipped
          echo "Vaultcore gate regression passed (only confirmed false permits a skip; relevant/unknown skips block)"
          check_required "$RES_UBUNTU_EDITORS" ubuntu-editors
          check_vaultcore "$RES_VAULTCORE_CLIENT_CHANGED" "$RES_MACOS_VAULTCORE"
          echo "✅ All applicable PR checks passed"
