name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOSEC_VERSION: v2.22.0

jobs:
  # ── Always-run jobs (PR + main) ──────────────────────────────────────────

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-input: '1.26.6'
          go-package: ./...

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run OSV Scanner
        id: osv_scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: >-
            --lockfile=go.mod
            --config=osv-scanner.toml
            --no-call-analysis=go
            --format=sarif
            --output=osv-results.sarif

      - name: Upload OSV SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: osv-results.sarif

      # osv-scanner-action's process exit code has been observed to be
      # nonzero even when every finding is explicitly ignored via
      # osv-scanner.toml and the uploaded SARIF (the actual GitHub Security
      # tab signal) contains zero results, so the job's pass/fail is decided
      # from the SARIF content itself rather than the raw scanner exit code.
      - name: Fail on unignored OSV findings
        if: always()
        run: |
          if [ ! -f osv-results.sarif ]; then
            echo "osv-results.sarif was not produced; treating as a scanner failure."
            exit 1
          fi
          count=$(jq '[.runs[].results[]?] | length' osv-results.sarif)
          echo "Findings remaining after osv-scanner.toml ignores: $count"
          if [ "$count" -gt 0 ]; then
            jq -r '.runs[].results[]? | "\(.ruleId): \(.message.text)"' osv-results.sarif
            exit 1
          fi
          if [ "${{ steps.osv_scan.outcome }}" != "success" ]; then
            echo "Note: OSV Scanner's own exit code (${{ steps.osv_scan.outcome }}) was non-zero, but the uploaded SARIF has zero findings after ignores; not failing the job on that alone."
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.11.4
          install-mode: binary
          args: --timeout=5m --verbose

      - name: Run gosec SAST scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }}
          gosec -exclude-generated -exclude-dir=testdata -fmt sarif -out gosec.sarif ./...

      - name: Upload gosec SARIF report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gosec-sarif
          path: gosec.sarif
          retention-days: 7

      - name: Upload gosec results to code scanning
        if: always() && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: gosec.sarif

  flake-vendorhash:
    name: Flake vendorHash
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Verify flake.nix vendorHash matches go.mod/go.sum
        run: |
          EXPECTED=$(grep -oP 'vendorHash\s*=\s*"\K[^"]+' flake.nix)
          if [ -z "$EXPECTED" ]; then
            echo "FAIL: could not find vendorHash in flake.nix"
            exit 1
          fi
          go mod vendor
          ACTUAL=$(nix --extra-experimental-features 'nix-command flakes' hash path --sri vendor/)
          rm -rf vendor
          echo "flake.nix vendorHash: $EXPECTED"
          echo "computed vendorHash:  $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "FAIL: flake.nix vendorHash is stale — update it to $ACTUAL"
            exit 1
          fi
          echo "PASS: flake.nix vendorHash matches the current go.mod/go.sum tree"

      - name: Build and run Nix flake
        run: |
          nix --extra-experimental-features 'nix-command flakes' build .#
          nix --extra-experimental-features 'nix-command flakes' run .# -- version

  port-contract:
    name: Rust port contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify frozen Go oracle and differential harness
        run: make port-contract

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview

      - name: Install pinned nightly Miri toolchain
        run: rustup toolchain install nightly-2026-09-03 --profile minimal --component miri,rust-src

      - name: Install Rust verification tools
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-nextest@0.9.143,cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-hack@0.6.45,cargo-llvm-cov@0.9.0
          fallback: none

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run Rust gates and Go differential contract
        run: make rust-gates

  rust-fuzz:
    name: Rust fuzz (main/schedule)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust fuzz toolchain
        run: rustup toolchain install nightly-2026-09-03 --profile minimal --component rust-src

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Run bounded main/scheduled Rust fuzz pass
        run: make rust-fuzz

  rust-native:
    name: Rust native (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check and lint
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test including doctests
        run: |
          cargo test --workspace --all-features --locked
          cargo test --workspace --doc --all-features --locked

  # ── PR-fast jobs ─────────────────────────────────────────────────────────

  test-pr:
    name: Test (ubuntu) — PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        env:
          CGO_ENABLED: '1'
          SYMVAULT_ALLOW_ENV_PASSPHRASE: '1'
        run: |
          go test -v -timeout=15m -skip 'TestFlow|TestBinaryE2E|Integration' ./...

  windows-process-tree:
    name: Process tree (Windows) — PR
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Windows process-tree regression
        run: >-
          go test -v -timeout=5m
          -run "TestCommandTimedOutRequiresEffectiveTreeCancellation|TestRunNaturalNonzeroExitIsNotTimedOut|TestRunDeadlineWithoutEffectiveTreeCancellationPreservesNaturalExit|TestRunPreservesWaitDelayWhenTreeIsAlreadyGone|TestRunAssignmentFailureCleansUpSynchronously|TestRunAssignmentFailureKillsUnassignedSuspendedProcess|TestWindowsClassifyAlreadyGoneWaitDelayEINVAL|TestRunTimeoutKillsDescendantJobObject|TestRunTimeoutWaitsForInheritedPipeCleanup|TestWindowsProcessTreeLifecycleAndErrors|TestWindowsProcessTreeKillReportsActiveJob|TestWindowsProcessTreeKillReportsEmptyJob"
          ./scripts/rust-port/internal/diff

  build-pr:
    name: Build (linux-amd64) — PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, test-pr, govulncheck, dependency-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=dev -X main.commit=${{ github.sha }}" -o symvault-linux-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: symvault-linux-amd64
          path: symvault-linux-amd64
          retention-days: 1

  macos-vaultcore:
    name: Vaultcore (macOS)
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if client/** changed
        id: path-check
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^client/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Xcode 26 or newer for native icon builds
        if: steps.path-check.outputs.run == 'true'
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_MAJOR="$(xcodebuild -version | awk '$1 == "Xcode" { split($2, v, "."); print v[1]; exit }')"
          if [ -z "$XCODE_MAJOR" ] || [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "::error::Icon Composer .icon builds require Xcode 26 or newer (found: ${XCODE_MAJOR:-unknown})"
            exit 1
          fi

      - name: Set up Go
        if: steps.path-check.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build Vaultcore framework
        if: steps.path-check.outputs.run == 'true'
        run: scripts/build-vaultcore.sh

      - name: Install XcodeGen
        if: steps.path-check.outputs.run == 'true'
        run: brew install xcodegen

      - name: Build native Vault apps and verify icons
        if: steps.path-check.outputs.run == 'true'
        run: |
          set -euo pipefail
          go build -o symvault .
          xcodegen --spec client/project.yml --project client
          scripts/verify-vault-icon.sh --source-only

          MACOS_ARCHIVE="$RUNNER_TEMP/Symvault.xcarchive"
          xcodebuild -project client/Symvault.xcodeproj \
            -scheme Symvault \
            -configuration Release \
            -archivePath "$MACOS_ARCHIVE" \
            archive \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          scripts/verify-vault-icon.sh --bundle \
            "$MACOS_ARCHIVE/Products/Applications/Symaira Vault.app"

          IOS_DERIVED_DATA="$RUNNER_TEMP/SymvaultIOSDerivedData"
          xcodebuild -project client/Symvault.xcodeproj \
            -scheme SymvaultIOSApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$IOS_DERIVED_DATA" \
            build \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES
          scripts/verify-vault-icon.sh --bundle \
            "$IOS_DERIVED_DATA/Build/Products/Release-iphonesimulator/Symaira Vault.app"

      - name: Swift build
        if: steps.path-check.outputs.run == 'true'
        working-directory: client
        run: swift build

      - name: Swift test
        if: steps.path-check.outputs.run == 'true'
        working-directory: client
        run: swift test

  ubuntu-editors:
    name: Editors (Ubuntu)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check if editors/** changed
        id: path-check
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^editors/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.path-check.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: editors/package-lock.json

      - name: Install dependencies
        if: steps.path-check.outputs.run == 'true'
        working-directory: editors
        run: npm ci

      - name: Build editors
        if: steps.path-check.outputs.run == 'true'
        working-directory: editors
        run: npm run build

      - name: Test editors
        if: steps.path-check.outputs.run == 'true'
        working-directory: editors
        run: npm test

  # ── Main / schedule only jobs ────────────────────────────────────────────

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26.6']
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run tests
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
          SYMVAULT_ALLOW_ENV_PASSPHRASE: '1'
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            go test -v -race -timeout=30m -coverprofile=coverage.out -skip 'TestFlow|TestBinaryE2E|Integration' ./...
          else
            go test -v -timeout=30m -skip 'TestFlow|TestBinaryE2E|Integration' ./...
          fi

      - name: Check coverage threshold
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== Total coverage check ==="
          COVERAGE_THRESHOLD=63.5
          echo "Threshold: ${COVERAGE_THRESHOLD}%"
          TOTAL_LINE=$(go tool cover -func=coverage.out | grep "total:")
          echo "Coverage line: $TOTAL_LINE"
          COVERAGE=$(echo "$TOTAL_LINE" | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "Total coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < $COVERAGE_THRESHOLD)}"; then
            echo "FAIL: Total coverage ${COVERAGE}% is below threshold of ${COVERAGE_THRESHOLD}%"
            exit 1
          fi
          echo "PASS: Total coverage ${COVERAGE}% meets threshold of ${COVERAGE_THRESHOLD}%"

          echo ""
          echo "=== Per-package coverage checks for security-critical packages ==="
          # Derived from the main coverage.out (single test pass): the default
          # -coverpkg scopes each test binary to its own package, so filtering
          # profile lines by full package path equals a dedicated per-package
          # run (verified locally: crypto 87.2, session 70.9, auth 91.5,
          # serverbootstrap 84.4 — identical; vault 85.0 vs 84.9 rounding).
          # NOTE: filter by FULL path — "/auth/" alone would also match cmd/auth.
          PKG_COV_TMP=$(mktemp -d)
          for PACKAGE in "internal/crypto" \
                         "internal/session" \
                         "internal/vault" \
                         "internal/mcp/auth" \
                         "internal/mcp/serverbootstrap"; do
            PKG_NAME=$(basename "$PACKAGE")
            PKG_PROFILE="$PKG_COV_TMP/${PKG_NAME}.out"
            { head -1 coverage.out; grep "symaira-vault/${PACKAGE}/" coverage.out || true; } > "$PKG_PROFILE"
            PKG_COV=$(go tool cover -func="$PKG_PROFILE" | grep '^total:' | grep -oE '[0-9]+\.[0-9]+' | tail -1)
            [ -z "$PKG_COV" ] && PKG_COV=0
            case "$PKG_NAME" in
              crypto)          PKG_THRESHOLD=85.0 ;;
              session)         PKG_THRESHOLD=70.0 ;;
              vault)           PKG_THRESHOLD=72.0 ;;
              auth)            PKG_THRESHOLD=82.0 ;;
              serverbootstrap) PKG_THRESHOLD=78.0 ;;
              *)               PKG_THRESHOLD=65.0 ;;
            esac
            echo "${PKG_NAME}: ${PKG_COV}% (threshold: ${PKG_THRESHOLD}%)"
            if awk "BEGIN {exit !($PKG_COV < $PKG_THRESHOLD)}"; then
              echo "FAIL: ${PKG_NAME} coverage ${PKG_COV}% is below threshold of ${PKG_THRESHOLD}%"
              exit 1
            fi
            echo "PASS: ${PKG_NAME} coverage ${PKG_COV}% meets threshold of ${PKG_THRESHOLD}%"
          done
          rm -rf "$PKG_COV_TMP"

      - name: Run smoke tests
        shell: bash
        run: go test -v -timeout=15m -tags smoke -run TestBetaSmoke .

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 7

  fuzz:
    name: Fuzz Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run fuzz tests
        run: |
          echo "Running fuzz tests with 55s per target..."
          go test -fuzz=FuzzCSVImporterParse -fuzztime=55s -timeout=180s ./internal/importer/
          go test -fuzz=FuzzBitwardenImporterParse -fuzztime=55s -timeout=180s ./internal/importer/
          go test -fuzz=FuzzOnePUXImporterParse -fuzztime=55s -timeout=180s ./internal/importer/
          go test -fuzz=FuzzParsePassEntry -fuzztime=55s -timeout=180s ./internal/importer/
          go test -fuzz=FuzzNormalizePath -fuzztime=55s -timeout=180s ./internal/importer/
          go test -fuzz=FuzzParseMapping -fuzztime=55s -timeout=180s ./internal/importer/
          echo "All fuzz tests passed without crashes"

  build:
    name: Build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, test, govulncheck, dependency-scan]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: arm64
            extension: .exe
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          output_name="symvault-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}"
          go build -ldflags="-s -w -X main.version=dev -X main.commit=${{ github.sha }}" -o "$output_name" .
          echo "Built: $output_name"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: symvault-${{ matrix.goos }}-${{ matrix.goarch }}
          path: symvault-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.extension }}
          retention-days: 7

  integration-test:
    name: Integration Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install GPG (for encryption tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2

      - name: Run integration tests
        run: |
          go test -v -timeout=10m ./... -run Integration 2>&1
        env:
          CI: true

  smoke-test:
    name: Binary Smoke Test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download linux-amd64 binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: symvault-linux-amd64
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/symvault-linux-amd64

      - name: Smoke test - help flag
        run: ./bin/symvault-linux-amd64 --help

      - name: Smoke test - subcommand help pages
        run: |
          ./bin/symvault-linux-amd64 get --help
          ./bin/symvault-linux-amd64 set --help
          ./bin/symvault-linux-amd64 list --help
          ./bin/symvault-linux-amd64 serve --help

      - name: Smoke test - vault operations
        run: |
          BIN="./bin/symvault-linux-amd64"
          VAULT_DIR=$(mktemp -d)
          PASSPHRASE="test-passphrase-123"
          export SYMVAULT_ALLOW_ENV_PASSPHRASE=1

          echo "Testing vault initialization..."
          SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN init "$VAULT_DIR"

          echo "Testing entry creation..."
          SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN --vault "$VAULT_DIR" set "test.entry" --value "test-value-456"

          echo "Testing entry retrieval..."
          OUTPUT=$(SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN --vault "$VAULT_DIR" get "test.entry")
          if [ "$OUTPUT" != "test-value-456" ]; then
            echo "ERROR: Expected 'test-value-456', got '$OUTPUT'"
            exit 1
          fi
          echo "Entry retrieval successful"

          echo "Testing list command..."
          LIST_OUTPUT=$(SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN --vault "$VAULT_DIR" list)
          if ! echo "$LIST_OUTPUT" | grep -q "test"; then
            echo "ERROR: List output does not contain 'test'"
            exit 1
          fi
          echo "List command successful"

          echo "Testing find command..."
          FIND_OUTPUT=$(SYMVAULT_PASSPHRASE="$PASSPHRASE" $BIN --vault "$VAULT_DIR" find "test-value")
          if ! echo "$FIND_OUTPUT" | grep -q "test"; then
            echo "ERROR: Find output does not contain 'test'"
            exit 1
          fi
          echo "Find command successful"

          echo "Cleaning up test vault..."
          rm -rf "$VAULT_DIR"

          echo "All smoke tests passed!"

  # The PR gate is intentionally a separate, PR-only job. Main/schedule-only
  # jobs are not dependencies here because skipped jobs must not manufacture a
  # false PR prerequisite.
  ci-gate:
    name: CI Success
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - govulncheck
      - dependency-scan
      - lint
      - flake-vendorhash
      - port-contract
      - rust
      - test-pr
      - windows-process-tree
      - build-pr
      - macos-vaultcore
      - ubuntu-editors
    steps:
      - name: Regression-test gate result handling
        shell: bash
        run: |
          set -euo pipefail
          accepts() {
            case "$1" in success|skipped) return 0 ;; *) return 1 ;; esac
          }
          accepts success
          accepts skipped
          for result in failure cancelled pending; do
            if accepts "$result"; then
              echo "Gate regression: ${result} was incorrectly accepted" >&2
              exit 1
            fi
          done
          echo "Gate regression handling passed (success/skipped accepted; failure/cancelled/pending rejected)"

      - name: Verify applicable PR dependencies
        shell: bash
        env:
          RES_GOVULNCHECK: ${{ needs.govulncheck.result }}
          RES_DEPENDENCY_SCAN: ${{ needs.dependency-scan.result }}
          RES_LINT: ${{ needs.lint.result }}
          RES_FLAKE_VENDORHASH: ${{ needs.flake-vendorhash.result }}
          RES_PORT_CONTRACT: ${{ needs.port-contract.result }}
          RES_RUST: ${{ needs.rust.result }}
          RES_TEST_PR: ${{ needs.test-pr.result }}
          RES_WINDOWS_PROCESS_TREE: ${{ needs.windows-process-tree.result }}
          RES_BUILD_PR: ${{ needs.build-pr.result }}
          RES_MACOS_VAULTCORE: ${{ needs.macos-vaultcore.result }}
          RES_UBUNTU_EDITORS: ${{ needs.ubuntu-editors.result }}
        run: |
          set -euo pipefail
          check_required() {
            local result="$1" label="$2"
            if [ "$result" != success ]; then
              echo "❌ ${label} (${result:-missing})" >&2
              exit 1
            fi
            echo "✅ ${label} (${result})"
          }
          check_path_gated() {
            local result="$1" label="$2"
            case "$result" in
              success|skipped) echo "✅ ${label} (${result})" ;;
              *) echo "❌ ${label} (${result:-missing})" >&2; exit 1 ;;
            esac
          }
          check_required "$RES_GOVULNCHECK" govulncheck
          check_required "$RES_DEPENDENCY_SCAN" dependency-scan
          check_required "$RES_LINT" lint
          check_required "$RES_FLAKE_VENDORHASH" flake-vendorhash
          check_required "$RES_PORT_CONTRACT" port-contract
          check_required "$RES_RUST" rust
          check_required "$RES_TEST_PR" test-pr
          check_required "$RES_WINDOWS_PROCESS_TREE" windows-process-tree
          check_required "$RES_BUILD_PR" build-pr
          check_path_gated "$RES_MACOS_VAULTCORE" macos-vaultcore
          check_path_gated "$RES_UBUNTU_EDITORS" ubuntu-editors
          echo "✅ All applicable PR checks passed"
