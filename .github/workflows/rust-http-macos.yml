name: Rust HTTP macOS satellites

# Consolidates the eight HTTP-family macOS legs (HEAD, Host/Origin, OAuth,
# absolute read deadlines, configured deadlines, absolute write deadlines,
# request framing, live TLS/mTLS) into ONE GitHub-hosted xcode-27 job.
# The eight original workflows keep their ubuntu/windows legs unchanged.
# A Linux select job decides per satellite; a satellite runs unless the
# selector explicitly outputs 'false' (fail-closed: missing/failed selector runs all).
# Each satellite's commands are copied verbatim from its original workflow
# (baseline: scripts/ci_macos_satellites_baseline.json, source 895b1fe7).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select HTTP macOS satellites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      group_http: ${{ steps.select.outputs.group_http }}
      head: ${{ steps.select.outputs.head }}
      origin: ${{ steps.select.outputs.origin }}
      oauth: ${{ steps.select.outputs.oauth }}
      deadline: ${{ steps.select.outputs.deadline }}
      timeout: ${{ steps.select.outputs.timeout }}
      write: ${{ steps.select.outputs.write }}
      framing: ${{ steps.select.outputs.framing }}
      tls: ${{ steps.select.outputs.tls }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify selector unit and structural checks
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/macos-satellite-checks"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3'
          "$venv/bin/python" -B scripts/test_ci_macos_satellites.py
      - name: Select satellites from the diff (fail-closed)
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          python3 -B scripts/ci_macos_satellites.py select --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT" || {
            # Fail closed: if the selector itself cannot run, every satellite runs.
            echo 'selector failed; selecting all satellites' >&2
            printf 'any=true\n' >> "$GITHUB_OUTPUT"
            for k in group_http head origin oauth deadline timeout write framing tls; do printf '%s=true\n' "$k" >> "$GITHUB_OUTPUT"; done
          }

  macos-http:
    name: HTTP satellites (macos-latest)
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.group_http != 'false') }}
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      GOTOOLCHAIN: "go1.26.6"
      GOWORK: "off"
      RUSTUP_TOOLCHAIN: "1.98.0"
      RUST_TEST_THREADS: "1"
      TZ: "UTC"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: "Assert actual native macOS arm64"
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Set up pinned Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
      - name: "Set up pinned Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: "Install pinned Rust"
        run: |-
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: "Shared prologue complete"
        id: prologue
        run: |
          echo 'shared macOS prologue complete'
      - name: "[HTTP HEAD] Build the owned oracle compiler runner"
        id: head-0
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          mkdir -p target
          runner=target/oraclebuild
          if [[ "$RUNNER_OS" == "Windows" ]]; then runner+=.exe; fi
          go build -trimpath -o "$runner" ./scripts/rust-port/cmd/oraclebuild
      - name: "[HTTP HEAD] Test owning runtime and CLI assembly"
        id: head-1
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' && steps.head-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-head-tests.txt 2>&1
          cat target/native-head-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('target/native-head-tests.txt').read_text()
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert results and sum(int(n) for n,_ in results)==(241 if os.environ['RUNNER_OS']=='Windows' else 243)
          assert all(int(ignored)==0 for _,ignored in results)
          assert 'browser_consent_requires_the_vault_passphrase_before_issuing_a_code ... ok' in text
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP HEAD] Execute actual native HEAD and persistent response boundaries"
        id: head-2
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' && steps.head-1.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_head_contract.py --rust "$rust_cli" --receipt target/native-http-head.json
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('target/native-http-head.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and r['candidate_worktree_clean_at_end']
          assert r['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['native_os'] in {'Linux','Darwin','Windows'} and not r['differences']
          for implementation in ['go','rust']:
              observed=r[implementation]
              assert len(observed['rows'])==13 and len(observed['authorization_heads'])==512
              assert len(observed['pipeline']['responses'])==2
              assert len(observed['processes'])==1
              assert all(p['output_capture_complete'] and not p['output_capture_errors'] and p['forced_cleanup_not_graceful_evidence'] for p in observed['processes'])
              assert observed['browser_control']['status_line']=='HTTP/1.1 200 OK'
          PY
      - name: "[HTTP HEAD] Preserve strict HTTP and actual OAuth corpora"
        id: head-3
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' && steps.head-2.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-head-http-process.json
          python3 scripts/rust-port/http_oauth_contract.py --rust "$rust_cli" --receipt target/native-head-http-oauth.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          http=json.loads(Path('target/native-head-http-process.json').read_bytes())
          oauth=json.loads(Path('target/native-head-http-oauth.json').read_bytes())
          assert all(r['passed'] and r['candidate_worktree_clean'] and not r['differences'] for r in [http,oauth])
          assert len(http['go'])==len(http['rust'])==65 and len(http['declared_differences'])==4
          assert len(oauth['semantic_controls'])==26
          for implementation in ['go','rust']:
              assert len(oauth[implementation]['rows'])==35 and len(oauth[implementation]['ttl_rows'])==11
          PY
      - name: "[HTTP HEAD] Retain complete actual native observations"
        id: head-4
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-head-macos-latest"
          path: "target/native-http-head.json\ntarget/native-head-http-process.json\ntarget/native-head-http-oauth.json\ntarget/native-head-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
      - name: "[HTTP HEAD] reset worktree between satellites"
        id: reset-head
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP Host/Origin] Test owning runtime and CLI assembly"
        id: origin-0
        if: "${{ !cancelled() && needs.select.outputs.origin != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-origin-tests.txt 2>&1
          cat target/native-origin-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('target/native-origin-tests.txt').read_text()
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert results and sum(int(n) for n,_ in results)==(241 if os.environ['RUNNER_OS']=='Windows' else 243)
          assert all(int(ignored)==0 for _,ignored in results)
          assert 'loopback_listener_rejects_foreign_origin_before_authentication ... ok' in text
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP Host/Origin] Execute actual native Host Origin and authenticated recovery controls"
        id: origin-1
        if: "${{ !cancelled() && needs.select.outputs.origin != 'false' && steps.origin-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_origin_contract.py --rust "$rust_cli" --receipt target/native-http-origin.json
          python3 - <<'CHECK'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('target/native-http-origin.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and r['candidate_worktree_clean_at_end']
          assert r['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['native_os'] in {'Linux','Darwin','Windows'} and not r['differences']
          assert len(r['declared_differences'])==69
          assert {d['decision'] for d in r['declared_differences']}=={'serialized-http-origin-required','loopback-host-required','valid-loopback-authority-required'}
          for implementation in ['go','rust']:
              observed=r[implementation]
              assert len(observed['rows'])==202 and len({x['case'] for x in observed['rows']})==202
              assert len(observed['processes'])==1
              assert all(p['output_capture_complete'] and not p['output_capture_errors'] and p['forced_cleanup_not_graceful_evidence'] for p in observed['processes'])
              assert observed['rows'][-1]['case']=='recovery-ping'
              assert observed['rows'][-1]['response']['status_line']=='HTTP/1.1 200 OK'
          CHECK
      - name: "[HTTP Host/Origin] Retain complete actual native observations"
        id: origin-2
        if: "${{ !cancelled() && needs.select.outputs.origin != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-origin-macos-latest"
          path: "target/native-http-origin.json\ntarget/native-origin-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
      - name: "[HTTP Host/Origin] reset worktree between satellites"
        id: reset-origin
        if: "${{ !cancelled() && needs.select.outputs.origin != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP OAuth] Verify owned compiler process trees and build the oracle runner"
        id: oauth-0
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          mkdir -p target
          go test -count=1 -v ./scripts/rust-port/internal/diff > target/native-oracle-process-tests.txt 2>&1 || { cat target/native-oracle-process-tests.txt; exit 1; }
          cat target/native-oracle-process-tests.txt
          runner=target/oraclebuild
          if [[ "$RUNNER_OS" == "Windows" ]]; then runner+=.exe; fi
          go build -trimpath -o "$runner" ./scripts/rust-port/cmd/oraclebuild
          python3 -B scripts/rust-port/test_oracle_build.py
      - name: "[HTTP OAuth] Test owning config runtime and CLI assembly"
        id: oauth-1
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' && steps.oauth-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-core -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-core --all-targets --locked > target/native-oauth-config-tests.txt 2>&1
          cat target/native-oauth-config-tests.txt
          cargo test -p symvault-mcp --all-targets --locked > target/native-oauth-tests.txt 2>&1
          cat target/native-oauth-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          config=Path('target/native-oauth-config-tests.txt').read_text()
          assert 'mcp_tls_settings_survive_config_roundtrip ... ok' in config
          text=Path('target/native-oauth-tests.txt').read_text()
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert results and sum(int(n) for n,_ in results)==(241 if os.environ['RUNNER_OS']=='Windows' else 243)
          assert all(int(ignored)==0 for _,ignored in results)
          assert 'consent_pkce_access_and_refresh_are_connected_and_single_use ... ok' in text
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP OAuth] Execute actual native consent PKCE rotation expiry and restart"
        id: oauth-2
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' && steps.oauth-1.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_oauth_contract.py --rust "$rust_cli" --receipt target/native-http-oauth.json
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('target/native-http-oauth.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and r['candidate_worktree_clean_at_end']
          assert r['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['native_os'] in {'Linux','Darwin','Windows'} and not r['differences']
          decisions={'fresh-persisted-client','bound-browser-consent','fresh-single-use-code','fresh-scoped-token-pair','single-use-browser-confirmation','server-bound-consent-metadata','server-bound-consent-pkce','server-side-consent-denial','configured-positive-token-ttls','bounded-refresh-after-access-expiry','bounded-refreshed-runtime-control'}
          assert len(r['semantic_controls'])==26 and {x['decision'] for x in r['semantic_controls']}==decisions
          for implementation in ['go','rust']:
              observed=r[implementation]
              assert len(observed['rows'])==35 and len(observed['ttl_rows'])==11
              rows=observed['rows']+observed['ttl_rows']
              assert len({x['case'] for x in rows})==46
              assert all({'status_line','headers','body_base64','wire_body_base64','raw_base64'}<=x['response'].keys() for x in rows)
              assert len(observed['processes'])==3
              assert all(p['output_capture_complete'] and not p['output_capture_errors'] and p['forced_cleanup_not_graceful_evidence'] for p in observed['processes'])
              assert observed['rows'][-1]['case']=='persisted-rotated-token-health'
              assert observed['ttl_rows'][-1]['case']=='ttl-old-access-still-denied'
          PY
      - name: "[HTTP OAuth] Preserve original strict HTTP corpus"
        id: oauth-3
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' && steps.oauth-2.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-http-process.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('target/native-http-process.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and not r['differences']
          assert len(r['go'])==len(r['rust'])==65 and len(r['declared_differences'])==4
          PY
      - name: "[HTTP OAuth] Retain complete actual native observations"
        id: oauth-4
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-oauth-macos-latest"
          path: "target/native-http-oauth.json\ntarget/native-http-process.json\ntarget/native-oauth-tests.txt\ntarget/native-oauth-config-tests.txt\ntarget/native-oracle-process-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
      - name: "[HTTP OAuth] reset worktree between satellites"
        id: reset-oauth
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP absolute read deadlines] Test owning runtime and CLI assembly"
        id: deadline-0
        if: "${{ !cancelled() && needs.select.outputs.deadline != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-deadline-tests.txt 2>&1
          cat target/native-deadline-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('target/native-deadline-tests.txt').read_text()
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert results and sum(int(n) for n,_ in results)==(241 if os.environ['RUNNER_OS']=='Windows' else 243)
          assert all(int(ignored)==0 for _,ignored in results)
          assert 'keep_alive_idle_timeout_matches_go_source_and_closes_socket ... ok' in text
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP absolute read deadlines] Execute actual native progressing input deadlines and idle reuse"
        id: deadline-1
        if: "${{ !cancelled() && needs.select.outputs.deadline != 'false' && steps.deadline-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_slow_peer_contract.py --rust "$rust_cli" --receipt target/native-http-read-deadlines.json
          python3 - <<'CHECK'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('target/native-http-read-deadlines.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and r['candidate_worktree_clean_at_end']
          assert r['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['native_os'] in {'Linux','Darwin','Windows'} and not r['differences'] and not r['declared_differences']
          for implementation in ['go','rust']:
              observed=r[implementation]
              assert len(observed['rows'])==3 and {x['case'] for x in observed['rows']}=={'initialize','ping-before','ping-after'}
              assert len(observed['slow_peers'])==2 and {x['case'] for x in observed['slow_peers']}=={'progressing-header','progressing-body'}
              assert observed['workers_joined'] and not observed['control_errors']
              for peer in observed['slow_peers']:
                  assert peer['peer_terminal_observed'] and not peer['forced_client_close'] and peer['sender_joined'] and peer['sent_progress_bytes']>=4
                  assert peer['peer_terminal_kind'] in {'eof','connection-reset'}
                  assert peer['termination'] in {'actual-empty-eof-or-reset','complete-go-json-error-before-write-deadline'}
              assert len(observed['idle_boundary']['responses'])==2 and observed['idle_boundary']['idle_wait_seconds']>=6
              assert len(observed['processes'])==1
              assert all(p['output_capture_complete'] and not p['output_capture_errors'] and p['forced_cleanup_not_graceful_evidence'] for p in observed['processes'])
          CHECK
      - name: "[HTTP absolute read deadlines] Retain complete actual native observations"
        id: deadline-2
        if: "${{ !cancelled() && needs.select.outputs.deadline != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-read-deadlines-macos-latest"
          path: "target/native-http-read-deadlines.json\ntarget/native-deadline-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
      - name: "[HTTP absolute read deadlines] reset worktree between satellites"
        id: reset-deadline
        if: "${{ !cancelled() && needs.select.outputs.deadline != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
