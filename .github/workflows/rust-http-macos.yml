name: Rust HTTP macOS satellites

# Consolidates the eight HTTP-family macOS legs (HEAD, Host/Origin, OAuth,
# absolute read deadlines, configured deadlines, absolute write deadlines,
# request framing, live TLS/mTLS) into ONE GitHub-hosted xcode-27 job.
# The eight original workflows keep their ubuntu legs unchanged.
# A Linux select job decides per satellite; a satellite runs unless the
# selector explicitly outputs 'false' (fail-closed: missing/failed selector runs all).
# Each satellite's commands are copied verbatim from its original workflow
# (baseline: scripts/ci_macos_satellites_baseline.json, rebased onto the Go-free originals).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select HTTP macOS satellites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      group_http: ${{ steps.select.outputs.group_http }}
      head: ${{ steps.select.outputs.head }}
      origin: ${{ steps.select.outputs.origin }}
      oauth: ${{ steps.select.outputs.oauth }}
      deadline: ${{ steps.select.outputs.deadline }}
      timeout: ${{ steps.select.outputs.timeout }}
      write: ${{ steps.select.outputs.write }}
      framing: ${{ steps.select.outputs.framing }}
      tls: ${{ steps.select.outputs.tls }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify selector unit and structural checks
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/macos-satellite-checks"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3'
          "$venv/bin/python" -B scripts/test_ci_macos_satellites.py
      - name: Select satellites from the diff (fail-closed)
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          python3 -B scripts/ci_macos_satellites.py select --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT" || {
            # Fail closed: if the selector itself cannot run, every satellite runs.
            echo 'selector failed; selecting all satellites' >&2
            printf 'any=true\n' >> "$GITHUB_OUTPUT"
            for k in group_http head origin oauth deadline timeout write framing tls; do printf '%s=true\n' "$k" >> "$GITHUB_OUTPUT"; done
          }

  macos-http:
    name: HTTP satellites (macos-latest)
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.group_http != 'false') }}
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: "1.98.0"
      RUST_TEST_THREADS: "1"
      TZ: "UTC"
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: "Assert actual native macOS arm64"
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Set up pinned Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: "Install pinned Rust"
        run: |-
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: "Shared prologue complete"
        id: prologue
        run: |
          echo 'shared macOS prologue complete'
      - name: "[HTTP HEAD] Test owning runtime and CLI assembly"
        id: head-0
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-head-tests.txt 2>&1 || { cat target/native-head-tests.txt; exit 1; }
          cat target/native-head-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-head-tests.txt browser_consent_requires_the_vault_passphrase_before_issuing_a_code --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP HEAD] Execute actual native HEAD and persistent response boundaries"
        id: head-1
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' && steps.head-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_head_contract.py --rust "$rust_cli" --receipt target/native-http-head.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-head.json --profile http-head
      - name: "[HTTP HEAD] Preserve strict HTTP and actual OAuth corpora"
        id: head-2
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' && steps.head-1.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-head-http-process.json
          python3 scripts/rust-port/http_oauth_contract.py --rust "$rust_cli" --receipt target/native-head-http-oauth.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-head-http-process.json --profile http-process
          python3 scripts/rust-port/gate_area_check.py receipt target/native-head-http-oauth.json --profile http-oauth
      - name: "[HTTP HEAD] Retain complete actual native observations"
        id: head-3
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-head-macos-latest"
          path: "target/native-http-head.json\ntarget/native-head-http-process.json\ntarget/native-head-http-oauth.json\ntarget/native-head-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
      - name: "[HTTP HEAD] reset worktree between satellites"
        id: reset-head
        if: "${{ !cancelled() && needs.select.outputs.head != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP Host/Origin] Test owning runtime and CLI assembly"
        id: origin-0
        if: "${{ !cancelled() && needs.select.outputs.origin != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-origin-tests.txt 2>&1 || { cat target/native-origin-tests.txt; exit 1; }
          cat target/native-origin-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-origin-tests.txt loopback_listener_rejects_foreign_origin_before_authentication --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP Host/Origin] Execute actual native Host Origin and authenticated recovery controls"
        id: origin-1
        if: "${{ !cancelled() && needs.select.outputs.origin != 'false' && steps.origin-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_origin_contract.py --rust "$rust_cli" --receipt target/native-http-origin.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-origin.json --profile http-origin
      - name: "[HTTP Host/Origin] Retain complete actual native observations"
        id: origin-2
        if: "${{ !cancelled() && needs.select.outputs.origin != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-origin-macos-latest"
          path: "target/native-http-origin.json\ntarget/native-origin-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
      - name: "[HTTP Host/Origin] reset worktree between satellites"
        id: reset-origin
        if: "${{ !cancelled() && needs.select.outputs.origin != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP OAuth] Test owning config runtime and CLI assembly"
        id: oauth-0
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-core -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-core --all-targets --locked > target/native-oauth-config-tests.txt 2>&1 || { cat target/native-oauth-config-tests.txt; exit 1; }
          cat target/native-oauth-config-tests.txt
          cargo test -p symvault-mcp --all-targets --locked > target/native-oauth-tests.txt 2>&1 || { cat target/native-oauth-tests.txt; exit 1; }
          cat target/native-oauth-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-oauth-config-tests.txt mcp_tls_settings_survive_config_roundtrip
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-oauth-tests.txt consent_pkce_access_and_refresh_are_connected_and_single_use --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP OAuth] Execute actual native consent PKCE rotation expiry and restart"
        id: oauth-1
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' && steps.oauth-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_oauth_contract.py --rust "$rust_cli" --receipt target/native-http-oauth.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-oauth.json --profile http-oauth
      - name: "[HTTP OAuth] Preserve original strict HTTP corpus"
        id: oauth-2
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' && steps.oauth-1.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-http-process.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('target/native-http-process.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and not r['differences']
          assert len(r['go'])==len(r['rust'])==65 and len(r['declared_differences'])==4
          PY
      - name: "[HTTP OAuth] Retain complete actual native observations"
        id: oauth-3
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-oauth-macos-latest"
          path: "target/native-http-oauth.json\ntarget/native-http-process.json\ntarget/native-oauth-tests.txt\ntarget/native-oauth-config-tests.txt\ntarget/native-oracle-process-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
      - name: "[HTTP OAuth] reset worktree between satellites"
        id: reset-oauth
        if: "${{ !cancelled() && needs.select.outputs.oauth != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP absolute read deadlines] Test owning runtime and CLI assembly"
        id: deadline-0
        if: "${{ !cancelled() && needs.select.outputs.deadline != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-deadline-tests.txt 2>&1 || { cat target/native-deadline-tests.txt; exit 1; }
          cat target/native-deadline-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-deadline-tests.txt keep_alive_idle_timeout_matches_go_source_and_closes_socket --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP absolute read deadlines] Execute actual native progressing input deadlines and idle reuse"
        id: deadline-1
        if: "${{ !cancelled() && needs.select.outputs.deadline != 'false' && steps.deadline-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_slow_peer_contract.py --rust "$rust_cli" --receipt target/native-http-read-deadlines.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-read-deadlines.json --profile http-read-deadlines
      - name: "[HTTP absolute read deadlines] Retain complete actual native observations"
        id: deadline-2
        if: "${{ !cancelled() && needs.select.outputs.deadline != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-read-deadlines-macos-latest"
          path: "target/native-http-read-deadlines.json\ntarget/native-deadline-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
      - name: "[HTTP absolute read deadlines] reset worktree between satellites"
        id: reset-deadline
        if: "${{ !cancelled() && needs.select.outputs.deadline != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP configured deadlines] Test owning runtime and CLI assembly"
        id: timeout-0
        if: "${{ !cancelled() && needs.select.outputs.timeout != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-core --all-targets --locked > target/native-timeout-core-tests.txt 2>&1 || { cat target/native-timeout-core-tests.txt; exit 1; }
          cat target/native-timeout-core-tests.txt
          cargo test -p symvault-mcp --all-targets --locked > target/native-timeout-tests.txt 2>&1 || { cat target/native-timeout-tests.txt; exit 1; }
          cat target/native-timeout-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-timeout-tests.txt keep_alive_idle_timeout_matches_go_source_and_closes_socket --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-timeout-core-tests.txt --results-ok
          cargo test -p symvault-cli --bin symvault --locked mcp_commands::tests > target/native-timeout-cli-owner.txt 2>&1 || { cat target/native-timeout-cli-owner.txt; exit 1; }
          cat target/native-timeout-cli-owner.txt
          python3 - <<'OWNER'
          import re
          from pathlib import Path
          text=Path('target/native-timeout-cli-owner.txt').read_text()
          rows=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert rows and sum(int(n) for n,_ in rows)>0 and all(int(i)==0 for _,i in rows)
          OWNER
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP configured deadlines] Execute actual native configured read deadlines and default fallbacks"
        id: timeout-1
        if: "${{ !cancelled() && needs.select.outputs.timeout != 'false' && steps.timeout-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_timeout_contract.py --rust "$rust_cli" --receipt target/native-http-timeouts.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-timeouts.json --profile http-timeouts
      - name: "[HTTP configured deadlines] Retain complete actual native observations"
        id: timeout-2
        if: "${{ !cancelled() && needs.select.outputs.timeout != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-timeouts-macos-latest"
          path: "target/native-http-timeouts.json\ntarget/native-timeout-tests.txt\ntarget/native-timeout-core-tests.txt\ntarget/native-timeout-cli-owner.txt\n"
          if-no-files-found: "error"
      - name: "[HTTP configured deadlines] reset worktree between satellites"
        id: reset-timeout
        if: "${{ !cancelled() && needs.select.outputs.timeout != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP absolute write deadlines] Test owning runtime and CLI assembly"
        id: write-0
        if: "${{ !cancelled() && needs.select.outputs.write != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          python3 scripts/rust-port/test_http_write_contract.py
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-write-tests.txt 2>&1 || { cat target/native-write-tests.txt; exit 1; }
          cat target/native-write-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-write-tests.txt keep_alive_idle_timeout_matches_go_source_and_closes_socket --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --bin symvault --locked mcp_commands::tests > target/native-write-cli-owner.txt 2>&1 || { cat target/native-write-cli-owner.txt; exit 1; }
          cat target/native-write-cli-owner.txt
          python3 - <<'OWNER'
          import re
          from pathlib import Path
          text=Path('target/native-write-cli-owner.txt').read_text()
          rows=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert rows and sum(int(n) for n,_ in rows)>0 and all(int(i)==0 for _,i in rows)
          OWNER
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[HTTP absolute write deadlines] Verify actual TLS backpressure and reject a disabled deadline"
        id: write-1
        if: "${{ !cancelled() && needs.select.outputs.write != 'false' && steps.write-0.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 -B scripts/rust-port/http_write_contract.py --rust "$rust_cli" --receipt target/native-tls-output.json --tls-output-probe-only
          python3 -B scripts/rust-port/http_write_mutation.py --rust "$rust_cli" --receipt target/native-tls-output-mutation.json
          git diff --exit-code -- crates/symvault-mcp/src/http.rs
      - name: "[HTTP absolute write deadlines] Execute actual native absolute writes and separate TLS admission"
        id: write-2
        if: "${{ !cancelled() && needs.select.outputs.write != 'false' && steps.write-1.outcome == 'success' }}"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_write_contract.py --rust "$rust_cli" --receipt target/native-http-write.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-write.json --profile http-write
      - name: "[HTTP absolute write deadlines] Retain complete actual native observations"
        id: write-3
        if: "${{ !cancelled() && needs.select.outputs.write != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-write-macos-latest"
          path: "target/native-http-write.json\ntarget/native-tls-output.json\ntarget/native-tls-output-mutation.json\ntarget/native-tls-output-mutation.mutant.json\ntarget/native-write-tests.txt\ntarget/native-write-cli-owner.txt\ntarget/native-oracle-process-tests.txt\ntarget/native-winsock-metadata.json\ntarget/native-winsock-schema.json\ntarget/native-winsock-loss.json\n"
          if-no-files-found: "error"
      - name: "[HTTP absolute write deadlines] reset worktree between satellites"
        id: reset-write
        if: "${{ !cancelled() && needs.select.outputs.write != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP request framing] Test owning runtime and CLI assembly"
        id: framing-0
        if: "${{ !cancelled() && needs.select.outputs.framing != 'false' && steps.prologue.outcome == 'success' }}"
        run: |
          set -euo pipefail
          cargo fmt --all --check
