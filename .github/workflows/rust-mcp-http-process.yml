name: Rust MCP HTTP native process contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-mcp-http-process.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'internal/mcp/apitemplates/builtin/**'
      - 'scripts/rust-port/http_process*'
      - 'scripts/rust-port/mcp_process_contract.py'
      - 'docs/adr/0017-http-wire-contract-and-token-sessions.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-process:
    name: MCP HTTP process (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test owning runtime and production CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-http-tests.txt 2>&1
          cat target/native-http-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',Path('target/native-http-tests.txt').read_text())
          assert results and sum(int(n) for n,_ in results)==(233 if os.environ['RUNNER_OS']=='Windows' else 235)
          assert all(int(ignored)==0 for _,ignored in results)
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Observe actual native HTTP bytes and stalled clients
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt native-http-process.json
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          receipt=json.loads(Path('native-http-process.json').read_bytes())
          assert receipt['passed'] and receipt['candidate_worktree_clean'] and not receipt['differences']
          assert receipt['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert receipt['native_os'] in {'Linux','Darwin','Windows'}
          decisions={'token-session-isolation','complete-json-body-required','valid-utf8-required','metadata-fresh-marker-semantic-control'}
          assert len(receipt['declared_differences'])==4 and {r['decision'] for r in receipt['declared_differences']}==decisions
          for implementation in ['go','rust']:
              rows=receipt[implementation]
              assert len(rows)==51 and len({r['case'] for r in rows})==51
              assert rows[-1]['case']=='mcp-ping-after-stalled-clients'
              assert all({'status_line','headers','body_base64','wire_body_base64','raw_base64'}<=r['response'].keys() for r in rows)
              assert {r['case'] for r in receipt[implementation+'_startup_denials']}=={'eof','no','blank','not-affirmative','unterminated-yes'}
              assert {r['case'] for r in receipt[implementation+'_stalled_clients']}=={'idle-before-request','incomplete-request-body'}
              assert receipt[implementation+'_process']['forced_cleanup_not_graceful_evidence']
          assert receipt['go_startup_denials']==receipt['rust_startup_denials']
          assert all(a['request_sha256']==b['request_sha256'] and not a['received_base64'] and not b['received_base64'] for a,b in zip(receipt['go_stalled_clients'],receipt['rust_stalled_clients'],strict=True))
          PY
      - name: Upload complete actual native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: http-process-${{ matrix.os }}
          path: |
            native-http-process.json
            target/native-http-tests.txt
          if-no-files-found: error
          retention-days: 14
