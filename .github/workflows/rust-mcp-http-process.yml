name: Rust MCP HTTP native process contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-mcp-http-process.yml'
      - 'crates/**'
      - 'third_party/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'scripts/rust-port/http_process*'
      - 'scripts/rust-port/test_http_process_contract.py'
      - 'testdata/**'
      - 'scripts/rust-port/mcp_process_contract.py'
      - 'scripts/rust-port/mcp_oracle.py'
      - 'docs/adr/0017-http-wire-contract-and-token-sessions.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http-process:
    name: MCP HTTP process (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      RUST_TEST_THREADS: '1'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout candidate and frozen observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test owning runtime and production CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          python3 scripts/rust-port/test_http_process_contract.py
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-http-tests.txt 2>&1 || { cat target/native-http-tests.txt; exit 1; }
          cat target/native-http-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-http-tests.txt http::tests::oversized_body_errors_follow_admission_without_creating_sessions http::tests::nonmcp_oversized_prefixes_preserve_accepted_main_wire_response http::tests::public_http_adapter_bounds_oversized_json_before_deserialization --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Observe actual native HTTP bytes and stalled clients
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-http-process.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-process.json --profile http-process
      - name: Upload complete actual native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: http-process-${{ matrix.os }}
          path: |
            target/native-http-process.json
            target/native-http-tests.txt
          if-no-files-found: error
          retention-days: 14
