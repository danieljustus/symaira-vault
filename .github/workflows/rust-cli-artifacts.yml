name: Rust CLI artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-cli-artifacts.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'scripts/rust-port/cli_artifacts*'
      - 'scripts/rust-port/cmd/cligap/**'
      - 'testdata/port/cli/**'
      - 'third_party/cobra-completion/**'
      - 'docs/adr/0011-cli-artifacts-and-completion-protocol.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: CLI artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      SYMVAULT_TEST_KEYRING: memory
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install native Linux shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bash zsh fish
      - name: Install native macOS shells
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install bash fish
          printf 'CLI_ARTIFACTS_BASH=%s/bin/bash\n' "$(brew --prefix bash)" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check and exercise owning Rust implementation
        run: |
          set -euo pipefail
          cargo fmt --all --check
          go test ./scripts/rust-port/cmd/cligap -count=1
          cargo clippy -p symvault-cli --all-targets --all-features --locked -- -D warnings
          python3 scripts/run_go_tests.py cargo -- cargo test -p symvault-cli --locked --bin symvault actual_go_protocol_queries_replay_through_real_rust_sessions_and_store
          python3 scripts/run_go_tests.py cargo -- cargo test -p symvault-cli --locked --test completions --test cli_generate_manpages --test cli_help --test cli_help_subcommand --test cli_update_help --test cli_get_list_help_differential --test cli_dynamic_setup_help
          cargo build -p symvault-cli --locked
      - name: Execute actual Go and Rust artifacts and native shells
        run: |
          set -euo pipefail
          rust_binary=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_binary=target/debug/symvault.exe; fi
          python3 scripts/run_go_tests.py cargo -- python3 scripts/rust-port/cli_artifacts_contract.py --rust "$rust_binary" --receipt native-cli-artifacts.json --captured-output native-cli-go-artifacts.json --require-native-shells
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('native-cli-artifacts.json').read_text())
          assert receipt['passed'] and receipt['candidate_worktree_clean']
          assert receipt['candidate_commit'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert receipt['actual_counts'] == {'help_pages':140,'scripts':8,'manuals':119,'actual_cli_queries':421}
          assert len(receipt['go_protocol_observations']) == 455
          expected = {'bash','powershell'} if receipt['native_os'] == 'Windows' else {'bash','zsh','fish'}
          assert expected <= receipt['actual_shells'].keys()
          PY
          go run ./scripts/rust-port/cmd/cligap --binary "$rust_binary" --output target/native-cli-artifact-gaps.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/native-cli-artifact-gaps.json').read_text())
          assert report['oracle_paths'] >= 134 and report['rust_paths'] >= 100
          assert not report['missing_paths'], 'every Go help path must be reachable'
          PY
      - name: Upload actual native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cli-artifacts-${{ matrix.os }}
          path: |
            native-cli-artifacts.json
            native-cli-go-artifacts.json
            target/native-cli-artifact-gaps.json
          if-no-files-found: error
          retention-days: 14
