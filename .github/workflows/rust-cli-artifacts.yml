name: Rust CLI artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-cli-artifacts.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'scripts/rust-port/build_timeout.py'
      - 'scripts/rust-port/cli_artifacts*'
      - 'scripts/rust-port/test_cli_artifacts_contract.py'
      - 'scripts/rust-port/manual_path*'
      - 'testdata/**'
      - 'third_party/**'
      - 'docs/adr/0011-cli-artifacts-and-completion-protocol.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: CLI artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      SYMVAULT_TEST_KEYRING: memory
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout candidate and frozen observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install native Linux shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bash zsh fish
      - name: Install native macOS shells
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install bash fish
          printf 'CLI_ARTIFACTS_BASH=%s/bin/bash\n' "$(brew --prefix bash)" >> "$GITHUB_ENV"
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check and exercise owning Rust implementation
        run: |
          set -euo pipefail
          cargo fmt --all --check
          mkdir -p target
          make port-fixtures-check
          python3 scripts/rust-port/manual_path_contract_test.py
          python3 scripts/rust-port/test_cli_artifacts_contract.py
          cargo clippy -p symvault-cli --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-cli --locked --bin symvault actual_go_protocol_queries_replay_through_real_rust_sessions_and_store
          cargo test -p symvault-cli --locked --test completions --test cli_generate_manpages --test cli_help --test cli_help_subcommand --test cli_update_help --test cli_get_list_help_differential --test cli_dynamic_setup_help
          cargo build -p symvault-cli --locked
      - name: Execute actual Go and Rust artifacts and native shells
        run: |
          set -euo pipefail
          rust_binary=target/debug/symvault
          python3 scripts/rust-port/cli_artifacts_contract.py --rust "$rust_binary" --receipt native-cli-artifacts.json --captured-output native-cli-go-artifacts.json --require-native-shells
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('native-cli-artifacts.json').read_text())
          assert receipt['passed'] and receipt['candidate_worktree_clean']
          assert receipt['candidate_commit'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert receipt['actual_counts'] == {'help_pages':140,'scripts':8,'manuals':119,'actual_cli_queries':503}
          assert len(receipt['go_protocol_observations']) == 537
          assert sum(row['name'].startswith('parser/') for row in receipt['go_protocol_observations']) == 82
          assert sum('-quoted-' in row['name'] for row in receipt['go_protocol_observations']) == 18
          expected = {'bash','zsh','fish'}
          assert expected <= receipt['actual_shells'].keys()
          PY
      - name: Upload actual native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-artifacts-${{ matrix.os }}
          path: |
            native-cli-artifacts.json
            native-cli-go-artifacts.json
            target/cli-artifacts-captures/
            target/cli-artifacts-failures/
          if-no-files-found: error
          retention-days: 14
