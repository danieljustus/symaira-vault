name: Rust intake CLI

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-intake-cli.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-sync/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'scripts/rust-port/intake_watch_contract.py'
      - 'internal/intake/**'
      - 'cmd/intake/**'
      - 'docs/adr/0010-intake-polling-and-quarantine.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    name: Intake CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      SYMVAULT_TEST_KEYRING: memory
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check and test owning adapters
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-sync --all-targets --all-features --locked -- -D warnings
          python3 scripts/run_go_tests.py cargo -- cargo test -p symvault-sync --locked --test intake_spool_security --test intake_scan_summary --test intake_watcher_contract --test intake_run_loop
          cargo build -p symvault-cli --locked
      - name: Execute actual Go and Rust CLI contracts
        run: |
          set -euo pipefail
          rust_binary=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_binary=target/debug/symvault.exe; fi
          python3 scripts/run_go_tests.py cargo -- python3 scripts/rust-port/intake_watch_contract.py --rust "$rust_binary" --receipt native-intake-cli.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('native-intake-cli.json').read_text())
          assert receipt['passed'] and receipt['candidate_worktree_clean']
          assert receipt['candidate_commit'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          required = {'missing-directory', 'missing-argument', 'disable-absent', 'disable-present', 'json-staging', 'encrypted-batch', 'encrypted-batch-repeat', 'go-readback', 'interrupt', 'file-env', 'file-text', 'file-json', 'extension-not-type', 'attachment-empty', 'attachment-png', 'file-ocr', 'file-byte-limit', 'file-default-limits', 'invalid-interval', 'invalid-debounce', 'file-no-argument', 'file-unknown-flag', 'file-count-limit', 'file-bool-true', 'ordinary-encrypted-file', 'ordinary-encrypted-file-repeat'}
          if receipt['native_os'] != 'Windows': required.add('terminate')
          for implementation in ['go','rust']:
              assert required <= {case['case'] for case in receipt[implementation]}
          PY
          go run ./scripts/rust-port/cmd/cligap --binary "$rust_binary" --output target/native-intake-gaps.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/native-intake-gaps.json').read_text())
          for kind in ['missing_paths','flag_gaps','alias_gaps']:
              assert not any(gap['path'].startswith('symvault intake') for gap in report[kind] or []), kind
          PY
      - name: Upload actual native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: intake-cli-${{ matrix.os }}
          path: |
            native-intake-cli.json
            target/native-intake-gaps.json
          if-no-files-found: error
          retention-days: 14
