name: Rust serve compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-serve-cli.yml'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'testdata/**'
      - 'third_party/**'
      - 'internal/mcp/apitemplates/builtin/**'
      - 'scripts/rust-port/serve_contract.py'
      - 'docs/adr/0013-deprecated-serve-and-locked-stdio.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serve:
    name: Serve CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.9
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      SYMVAULT_TEST_KEYRING: memory
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check and test shared dispatch and service adapters
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-cli --locked --test cli_agent_setup_serve_stubs
          cargo test -p symvault-cli --locked --test cli_mcp_http_flags
          cargo test -p symvault-cli --bin symvault --locked daemon_commands::tests::
          cargo build -p symvault-cli --locked
      - name: Execute actual native Go and Rust contracts
        run: |
          set -euo pipefail
          rust_binary=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_binary=target/debug/symvault.exe; fi
          python3 scripts/rust-port/serve_contract.py --rust "$rust_binary" --receipt native-serve-cli.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('native-serve-cli.json').read_bytes())
          assert receipt['passed'] and receipt['candidate_worktree_clean']
          assert receipt['candidate_commit'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          required = {'bare-uninitialized', 'quiet-uninitialized', 'arbitrary-arguments', 'stdio-agent-required', 'empty-bind', 'locked-http-rejected', 'signed-port-accepted', 'valued-bool', 'tls-flags-reach-vault', 'locked-stdio', 'locked-unknown-agent', 'locked-canonical', 'locked-gui-metadata', 'locked-without-opt-in', 'unlocked-stdio', 'unlocked-allow-locked', 'unlocked-canonical', 'unlocked-unknown-agent', 'service-status-absent', 'service-install', 'service-status-running', 'service-status-quiet', 'service-uninstall', 'service-status-removed', 'canonical-service-status'}
          if receipt['native_os'] != 'Windows': required.add('service-helper-failure')
          required.update({'service-default-config', 'http-default-tls', 'http-custom-tls', 'http-client-ca'})
          for implementation in ['go','rust']:
              assert required == {case['case'] for case in receipt[implementation]}
          PY
          go run ./scripts/rust-port/cmd/cligap --binary "$rust_binary" --output target/native-serve-gaps.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/native-serve-gaps.json').read_bytes())
          for kind in ['missing_paths','flag_gaps','alias_gaps']:
              assert not any(gap['path'].startswith('symvault serve') for gap in report[kind] or []), kind
          PY
      - name: Upload actual native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: serve-cli-${{ matrix.os }}
          path: |
            native-serve-cli.json
            target/native-serve-gaps.json
          if-no-files-found: error
          retention-days: 14
