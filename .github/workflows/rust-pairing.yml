name: Rust pairing differential

on:
  push:
    # Integration branches are included, as in rust-store.yml: this workflow
    # does not exist on the default branch yet, so workflow_dispatch cannot
    # reach it, and a branch push is the only way to obtain native evidence
    # before the single bundled pull request.
    branches: [ main, 'migration/**' ]
    # Explicit allowlist rather than ci.yml's docs-only paths-ignore: a change
    # to the handshake contract must execute this gate instead of producing an
    # untested claim.
    paths:
      - 'crates/symvault-core/**'
      # The keyring and daemon gates below live in this workflow, but
      # nothing that implements them was listed, so a change to the
      # probe or its runner did not execute its own gate.
      - 'crates/symvault-platform/**'
      - 'scripts/rust-port/cmd/nativekeyringprobe/**'
      - 'scripts/rust-port/native_closeout.py'
      - 'scripts/rust-port/cmd/configprofilegen/**'
      - 'testdata/port/config_profiles_contract.json'
      - 'scripts/rust-port/cmd/caserun/**'
      - 'scripts/rust-port/cmd/devicelistdriver/**'
      - 'scripts/rust-port/internal/diff/**'
      - 'crates/symvault-cli/**'
      - 'scripts/rust-port/*device_list*'
      - '.github/workflows/rust-pairing.yml'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'go.mod'
      - 'go.sum'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'crates/symvault-sync/Cargo.toml'
      - 'crates/symvault-sync/src/lib.rs'
      - 'crates/symvault-sync/src/pairing.rs'
      - 'crates/symvault-sync/tests/pairing_contract.rs'
      - 'internal/pairing/**'
      - 'cmd/device.go'
      - 'scripts/rust-port/cmd/pairinggen/**'
      - 'testdata/port/pairing/**'
      - 'docs/rust-port/contract-matrix.md'
      - 'docs/rust-port/work-items.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/symvault-core/**'
      # The keyring and daemon gates below live in this workflow, but
      # nothing that implements them was listed, so a change to the
      # probe or its runner did not execute its own gate.
      - 'crates/symvault-platform/**'
      - 'scripts/rust-port/cmd/nativekeyringprobe/**'
      - 'scripts/rust-port/native_closeout.py'
      - 'scripts/rust-port/cmd/configprofilegen/**'
      - 'testdata/port/config_profiles_contract.json'
      - 'scripts/rust-port/cmd/caserun/**'
      - 'scripts/rust-port/cmd/devicelistdriver/**'
      - 'scripts/rust-port/internal/diff/**'
      - 'crates/symvault-cli/**'
      - 'scripts/rust-port/*device_list*'
      - '.github/workflows/rust-pairing.yml'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'go.mod'
      - 'go.sum'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'crates/symvault-sync/Cargo.toml'
      - 'crates/symvault-sync/src/lib.rs'
      - 'crates/symvault-sync/src/pairing.rs'
      - 'crates/symvault-sync/tests/pairing_contract.rs'
      - 'internal/pairing/**'
      - 'cmd/device.go'
      - 'scripts/rust-port/cmd/pairinggen/**'
      - 'testdata/port/pairing/**'
      - 'docs/rust-port/contract-matrix.md'
      - 'docs/rust-port/work-items.json'
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.6
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  pairing-native:
    name: Pairing differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # PAIRING-001 claims all platforms, so all three native runners execute
      # the gate. Cross-compilation is not runtime proof and is not used here.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pairinggen reads its oracle out of the pinned commit, so the full
          # history must be present.
          fetch-depth: 0

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Verify toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(rustc --version | awk '{print $2}')" = "1.98.0"

      - name: Run config profile differential against the pinned Go oracle
        shell: bash
        run: |
          set -euo pipefail
          make config-profile-differential

      - name: Run pairing differential against the pinned Go oracle
        shell: bash
        run: |
          set -euo pipefail
          make pairing-differential

      - name: Verify native process-tree adapter and cleanup
        shell: bash
        run: go test -count=1 -v ./scripts/rust-port/cmd/caserun ./scripts/rust-port/cmd/devicelistdriver ./scripts/rust-port/internal/diff

      - name: Run read-only device-list CLI differential
        shell: bash
        run: |
          set -euo pipefail
          make device-list-differential

      - name: Native CLI and session technical gates
        shell: bash
        run: python3 scripts/rust-port/native_closeout.py portable

      - name: Install disposable Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11


      - name: Native keyring resource probe
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SYMVAULT_DISPOSABLE_NATIVE_RUNNER: '1'
        run: python3 scripts/rust-port/native_closeout.py keyring

      - name: Native disposable launchd lifecycle
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        env:
          SYMVAULT_DISPOSABLE_NATIVE_RUNNER: '1'
        run: python3 scripts/rust-port/native_closeout.py daemon


      - name: Retain native closeout observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-closeout-${{ matrix.os }}
          path: target/native-closeout/
          if-no-files-found: warn

      - name: Retain live device-list observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-list-${{ matrix.os }}
          path: target/device-list-differential*.json
          if-no-files-found: error
