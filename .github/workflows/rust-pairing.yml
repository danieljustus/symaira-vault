name: Rust pairing differential

on:
  push:
    # Pull requests already run the same native matrix before merge.
    # Limit push events to main so each migration batch runs it once.
    branches: [ main ]
    # Explicit allowlist rather than ci.yml's docs-only paths-ignore: a change
    # to the handshake contract must execute this gate instead of producing an
    # untested claim.
    paths:
      - 'crates/symvault-core/**'
      - 'crates/symvault-platform/**'
      - 'scripts/rust-port/native_closeout.py'
      - 'scripts/rust-port/cmd/nativekeyringinterop/**'
      - 'scripts/rust-port/cmd/nativekeyringprobe/**'
      - 'scripts/rust-port/cmd/configprofilegen/**'
      - 'testdata/port/config_profiles_contract.json'
      - 'scripts/rust-port/cmd/caserun/**'
      - 'scripts/rust-port/cmd/devicelistdriver/**'
      - 'scripts/rust-port/internal/diff/**'
      - 'crates/symvault-cli/**'
      - 'internal/vault/**'
      - 'cmd/auth/**'
      - 'scripts/rust-port/*device_list*'
      - '.github/workflows/rust-pairing.yml'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'go.mod'
      - 'go.sum'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'crates/symvault-sync/Cargo.toml'
      - 'crates/symvault-sync/src/lib.rs'
      - 'crates/symvault-sync/src/pairing.rs'
      - 'crates/symvault-sync/tests/pairing_contract.rs'
      - 'internal/pairing/**'
      - 'cmd/device.go'
      - 'scripts/rust-port/cmd/pairinggen/**'
      - 'testdata/port/pairing/**'
      - 'docs/rust-port/contract-matrix.md'
      - 'docs/rust-port/work-items.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/symvault-core/**'
      - 'crates/symvault-platform/**'
      - 'scripts/rust-port/native_closeout.py'
      - 'scripts/rust-port/cmd/nativekeyringinterop/**'
      - 'scripts/rust-port/cmd/nativekeyringprobe/**'
      - 'scripts/rust-port/cmd/configprofilegen/**'
      - 'testdata/port/config_profiles_contract.json'
      - 'scripts/rust-port/cmd/caserun/**'
      - 'scripts/rust-port/cmd/devicelistdriver/**'
      - 'scripts/rust-port/internal/diff/**'
      - 'crates/symvault-cli/**'
      - 'internal/vault/**'
      - 'cmd/auth/**'
      - 'scripts/rust-port/*device_list*'
      - '.github/workflows/rust-pairing.yml'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'go.mod'
      - 'go.sum'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'crates/symvault-sync/Cargo.toml'
      - 'crates/symvault-sync/src/lib.rs'
      - 'crates/symvault-sync/src/pairing.rs'
      - 'crates/symvault-sync/tests/pairing_contract.rs'
      - 'internal/pairing/**'
      - 'cmd/device.go'
      - 'scripts/rust-port/cmd/pairinggen/**'
      - 'testdata/port/pairing/**'
      - 'docs/rust-port/contract-matrix.md'
      - 'docs/rust-port/work-items.json'
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.6
  RUSTUP_TOOLCHAIN: 1.98.0
  CARGO_BUILD_JOBS: '2'
  GOMAXPROCS: '2'

jobs:
  pairing-native:
    name: Pairing differential (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # PAIRING-001 claims all platforms, so all three native runners execute
      # the gate. Cross-compilation is not runtime proof and is not used here.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pairinggen reads its oracle out of the pinned commit, so the full
          # history must be present.
          fetch-depth: 0

      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Verify toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(rustc --version | awk '{print $2}')" = "1.98.0"

      - name: Run stateful CLI differential against Go v0.22.1
        shell: bash
        run: |
          set -euo pipefail
          oracle_tag_commit="$(git rev-parse 'refs/tags/v0.22.1^{commit}')"
          test "$oracle_tag_commit" = "caadd5ef95e8f19fabd3ae3d2c04caa296f2fd44"

          temp_root="$RUNNER_TEMP"
          executable_suffix=
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            temp_root="$(cygpath -u "$RUNNER_TEMP")"
            executable_suffix=.exe
          fi
          oracle_source="$temp_root/symvault-go-v0.22.1-source"
          oracle_binary="$temp_root/symvault-go-v0.22.1$executable_suffix"

          git worktree add --detach "$oracle_source" refs/tags/v0.22.1
          test "$(git -C "$oracle_source" rev-parse HEAD)" = "$oracle_tag_commit"
          GOWORK=off go -C "$oracle_source" build -o "$oracle_binary" .
          test -f "$oracle_binary"
          export SYMVAULT_GO_BINARY="$oracle_binary"
          test -f "$SYMVAULT_GO_BINARY"
          cargo test -p symvault-cli --test cli_differential --locked \
            init_list_get_match_go_cli_on_a_disposable_vault -- --exact

      - name: Run auth root-trust differential against the current Go oracle
        shell: bash
        run: |
          set -euo pipefail
          temp_root="$RUNNER_TEMP"
          executable_suffix=
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            temp_root="$(cygpath -u "$RUNNER_TEMP")"
            executable_suffix=.exe
          fi
          oracle_binary="$temp_root/symvault-go-auth$executable_suffix"
          GOWORK=off go build -o "$oracle_binary" .
          test -f "$oracle_binary"
          export SYMVAULT_GO_BINARY="$oracle_binary"
          cargo test -p symvault-cli --test auth_differential auth_rotate --locked

      - name: Run config profile differential against the pinned Go oracle
        shell: bash
        run: |
          set -euo pipefail
          make config-profile-differential

      - name: Run Windows config and policy path differential
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $oracle = Join-Path $env:RUNNER_TEMP 'symvault-go.exe'
          go build -o $oracle .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SYMVAULT_GO_BINARY = $oracle
          cargo test -p symvault-cli --test config_validate_differential --test policy_differential --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run pairing differential against the pinned Go oracle
        shell: bash
        run: |
          set -euo pipefail
          make pairing-differential

      - name: Verify native process-tree adapter and cleanup
        shell: bash
        run: go test -count=1 -v ./scripts/rust-port/cmd/caserun ./scripts/rust-port/cmd/devicelistdriver ./scripts/rust-port/internal/diff

      - name: Run read-only device-list CLI differential
        shell: bash
        run: |
          set -euo pipefail
          make device-list-differential

      - name: Native CLI and session technical gates
        shell: bash
        run: python3 scripts/rust-port/native_closeout.py portable

      - name: Install disposable Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11


      - name: Native keyring resource probe
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SYMVAULT_DISPOSABLE_NATIVE_RUNNER: '1'
        run: python3 scripts/rust-port/native_closeout.py keyring

      - name: Native disposable launchd lifecycle
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        env:
          SYMVAULT_DISPOSABLE_NATIVE_RUNNER: '1'
        run: python3 scripts/rust-port/native_closeout.py daemon

      - name: Native disposable clipboard round trip
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        env:
          SYMVAULT_DISPOSABLE_NATIVE_RUNNER: '1'
        run: python3 scripts/rust-port/native_closeout.py clipboard


      - name: Retain native closeout observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-closeout-${{ matrix.os }}
          path: target/native-closeout/
          if-no-files-found: warn

      - name: Retain live device-list observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: device-list-${{ matrix.os }}
          path: target/device-list-differential*.json
          if-no-files-found: error
