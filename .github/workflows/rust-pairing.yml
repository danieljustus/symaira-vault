name: Rust pairing differential

on:
  push:
    # Pull requests already run the same native matrix before merge.
    # Limit push events to main so each migration batch runs it once.
    branches: [ main ]
    # Explicit allowlist rather than ci.yml's docs-only paths-ignore: a change
    # to the handshake contract must execute this gate instead of producing an
    # untested claim.
    paths:
      - 'crates/symvault-core/**'
      - 'crates/symvault-platform/**'
      - 'scripts/rust-port/build_timeout.py'
      - 'scripts/rust-port/test_store004_isolation.py'
      - 'scripts/rust-port/native_closeout.py'
      - 'scripts/rust-port/test_http001init_isolation.py'
      - 'testdata/port/mcp/http-initialize.json'
      - 'crates/symvault-mcp/tests/http_initialize.rs'
      - 'testdata/port/config_profiles_contract.json'
      - 'crates/symvault-cli/**'
      - 'scripts/rust-port/*device_list*'
      - '.github/workflows/rust-pairing.yml'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'crates/symvault-sync/Cargo.toml'
      - 'crates/symvault-sync/src/lib.rs'
      - 'crates/symvault-sync/src/pairing.rs'
      - 'crates/symvault-sync/tests/pairing_contract.rs'
      - 'testdata/port/pairing/**'
      - 'docs/rust-port/contract-matrix.md'
      - 'docs/rust-port/work-items.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'crates/symvault-core/**'
      - 'crates/symvault-platform/**'
      - 'scripts/rust-port/build_timeout.py'
      - 'scripts/rust-port/test_store004_isolation.py'
      - 'scripts/rust-port/native_closeout.py'
      - 'scripts/rust-port/test_http001init_isolation.py'
      - 'testdata/port/mcp/http-initialize.json'
      - 'crates/symvault-mcp/tests/http_initialize.rs'
      - 'testdata/port/config_profiles_contract.json'
      - 'crates/symvault-cli/**'
      - 'scripts/rust-port/*device_list*'
      - '.github/workflows/rust-pairing.yml'
      - '.github/workflows/ci.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - 'crates/symvault-sync/Cargo.toml'
      - 'crates/symvault-sync/src/lib.rs'
      - 'crates/symvault-sync/src/pairing.rs'
      - 'crates/symvault-sync/tests/pairing_contract.rs'
      - 'testdata/port/pairing/**'
      - 'docs/rust-port/contract-matrix.md'
      - 'docs/rust-port/work-items.json'
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.98.0
  CARGO_BUILD_JOBS: '2'

jobs:
  pairing-native:
    name: Pairing differential (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # PAIRING-001 claims all platforms, so all three native runners execute
      # the gate. Cross-compilation is not runtime proof and is not used here.
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # pairinggen reads its oracle out of the pinned commit, so the full
          # history must be present.
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Verify toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(rustc --version | awk '{print $2}')" = "1.98.0"

      - name: Run stateful CLI differential (replay of Go v0.22.1 observations)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symvault-cli --test cli_differential --locked \
            init_list_get_match_go_cli_on_a_disposable_vault -- --exact

      - name: Run import quarantine differential (replay of pinned Go CLI observations)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symvault-cli --test cli_differential --locked \
            import_quarantine_matches_pinned_go_cli_batch_contract -- --exact

      - name: Run auth root-trust differential (replay)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symvault-cli --test auth_differential auth_rotate --locked

      - name: Run startup-profile differential (replay)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p symvault-cli --test startup_profile_differential --locked

      - name: Run config profile differential (replay of pinned Go observations)
        shell: bash
        run: |
          set -euo pipefail
          make config-profile-differential

      - name: Run pairing differential (replay of pinned Go observations)
        shell: bash
        run: |
          set -euo pipefail
          make pairing-differential

      - name: Run read-only device-list CLI differential
        shell: bash
        run: |
          set -euo pipefail
          make device-list-differential

      - name: Verify HTTP-001 generator keyring isolation
        if: runner.os == 'macOS'
        shell: bash
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/rust-port/test_http001init_isolation.py

      - name: Verify complete port contract on native macOS
        if: runner.os == 'macOS'
        # Hosted runs take 15-18 minutes; 20 left too little headroom
        # (run 40957343241 timed out). The 45-minute job bound still applies.
        timeout-minutes: 30
        shell: bash
        # Verify the documented entrypoint without inherited backend selectors.
        run: env -u CI -u GITHUB_ACTIONS -u HEADLESS -u SYMVAULT_TEST_KEYRING make port-contract

      - name: Native CLI and session technical gates
        shell: bash
        run: python3 scripts/rust-port/native_closeout.py portable

      - name: Install disposable Linux Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring dbus-x11


      - name: Native keyring resource probe
        if: ${{ !cancelled() }}
        shell: bash
        env:
          SYMVAULT_DISPOSABLE_NATIVE_RUNNER: '1'
        run: python3 scripts/rust-port/native_closeout.py keyring

      - name: Native disposable launchd lifecycle
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        env:
          SYMVAULT_DISPOSABLE_NATIVE_RUNNER: '1'
        run: python3 scripts/rust-port/native_closeout.py daemon

      - name: Native disposable clipboard round trip
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        shell: bash
        env:
          SYMVAULT_DISPOSABLE_NATIVE_RUNNER: '1'
        run: python3 scripts/rust-port/native_closeout.py clipboard


      - name: Retain native closeout observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-closeout-${{ matrix.os }}
          path: target/native-closeout/
          if-no-files-found: warn

      - name: Retain live device-list observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-list-${{ matrix.os }}
          path: target/device-list-differential*.json
          if-no-files-found: error
