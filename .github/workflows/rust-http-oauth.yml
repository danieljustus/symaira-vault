name: Rust HTTP OAuth lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-http-oauth.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'scripts/rust-port/http_oauth*'
      - 'scripts/rust-port/http_process*'
      - 'scripts/rust-port/mcp_process_contract.py'
      - 'docs/adr/0019-oauth-consent-binding-and-token-lifetimes.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oauth:
    name: HTTP OAuth (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in rust-http-macos.yml as one consolidated GitHub-hosted job.
        os: [ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      RUST_TEST_THREADS: '1'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout candidate and frozen observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test owning config runtime and CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-core -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-core --all-targets --locked > target/native-oauth-config-tests.txt 2>&1 || { cat target/native-oauth-config-tests.txt; exit 1; }
          cat target/native-oauth-config-tests.txt
          cargo test -p symvault-mcp --all-targets --locked > target/native-oauth-tests.txt 2>&1 || { cat target/native-oauth-tests.txt; exit 1; }
          cat target/native-oauth-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-oauth-config-tests.txt mcp_tls_settings_survive_config_roundtrip
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-oauth-tests.txt consent_pkce_access_and_refresh_are_connected_and_single_use --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Execute actual native consent PKCE rotation expiry and restart
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_oauth_contract.py --rust "$rust_cli" --receipt target/native-http-oauth.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-oauth.json --profile http-oauth
      - name: Preserve original strict HTTP corpus
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-http-process.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('target/native-http-process.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and not r['differences']
          assert len(r['go'])==len(r['rust'])==65 and len(r['declared_differences'])==4
          PY
      - name: Retain complete actual native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: http-oauth-${{ matrix.os }}
          path: |
            target/native-http-oauth.json
            target/native-http-process.json
            target/native-oauth-tests.txt
            target/native-oauth-config-tests.txt
            target/native-oracle-process-tests.txt
          if-no-files-found: error
          retention-days: 14
