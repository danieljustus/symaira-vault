name: Vault read resource policy

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vault-read-resource-policy.yml'
      - 'scripts/rust-port/refresh-read-policy-fixtures.py'
      - 'testdata/port/store/read-resource-policy.json'
      - 'docs/adr/0008-vault-read-resource-policy.md'
      - 'crates/symvault-cli/tests/fixtures/import-review/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-cli/src/**'
      - 'crates/symvault-mcp/src/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Read policy (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout candidate and frozen observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Re-execute actual immutable Go observations
        run: python3 scripts/rust-port/refresh-read-policy-fixtures.py --check --receipt native-read-policy.json
      - name: Execute Rust policy and request regressions
        run: |
          set -euo pipefail
          cargo test -p symvault-store --lib --all-features > rust-read-store.log 2>&1
          cargo test -p symvault-cli --bin symvault template_resolutions_share_the_operation_allowance > rust-read-template.log 2>&1
          cargo test -p symvault-mcp --lib run_command_secret_refs_share_one_resource_allowance > rust-read-mcp.log 2>&1
          python3 -c 'from pathlib import Path; required={"rust-read-store.log":["actual_go_resource_policy_observations_match_rust","recovery_resource_failures_preserve_journal_and_originals"],"rust-read-template.log":["template_resolutions_share_the_operation_allowance"],"rust-read-mcp.log":["run_command_secret_refs_share_one_resource_allowance"]}; [(__import__("re").search(r"test .*"+name+r" \.\.\. ok",Path(path).read_text()) or (_ for _ in ()).throw(AssertionError(name))) for path,names in required.items() for name in names]'
      - name: Upload native policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: read-policy-${{ matrix.os }}
          path: |
            native-read-policy.json
            rust-read-*.log
          if-no-files-found: error
          retention-days: 14
