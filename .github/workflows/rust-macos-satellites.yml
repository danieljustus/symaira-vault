        id: "cli_artifacts-3"
        if: "${{ !cancelled() && needs.select.outputs.cli_artifacts != 'false' && steps.cli_artifacts-2.outcome == 'success' }}"
        env:
          GOWORK: "off"
          RUSTUP_TOOLCHAIN: "1.98.0"
          SYMVAULT_TEST_KEYRING: "memory"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          go test ./scripts/rust-port/cmd/cligap -count=1
          mkdir -p target
          go test ./internal/manpages ./scripts/rust-port/cmd/portgen -count=1 -v > target/native-go-manual-tests.txt 2>&1
          cat target/native-go-manual-tests.txt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('target/native-go-manual-tests.txt').read_text()
          for name in ['TestManpageLiteralText', 'TestManualConfigPathIsLiteralAndDescriptionsAreRestored', 'TestManualLiteralPathDoesNotRewriteOtherDescriptions']:
              assert '--- PASS: ' + name + ' ' in text, name
          PY
          make port-fixtures-check
          python3 scripts/rust-port/manual_path_contract_test.py
          python3 scripts/rust-port/test_cli_artifacts_contract.py
          cargo clippy -p symvault-cli --all-targets --all-features --locked -- -D warnings
          python3 scripts/run_go_tests.py cargo -- cargo test -p symvault-cli --locked --bin symvault actual_go_protocol_queries_replay_through_real_rust_sessions_and_store
          python3 scripts/run_go_tests.py cargo -- cargo test -p symvault-cli --locked --test completions --test cli_generate_manpages --test cli_help --test cli_help_subcommand --test cli_update_help --test cli_get_list_help_differential --test cli_dynamic_setup_help
          cargo build -p symvault-cli --locked
      - name: "[CLI artifacts] Execute actual Go and Rust artifacts and native shells"
        id: "cli_artifacts-4"
        if: "${{ !cancelled() && needs.select.outputs.cli_artifacts != 'false' && steps.cli_artifacts-3.outcome == 'success' }}"
        env:
          GOWORK: "off"
          RUSTUP_TOOLCHAIN: "1.98.0"
          SYMVAULT_TEST_KEYRING: "memory"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          rust_binary=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_binary=target/debug/symvault.exe; fi
          python3 scripts/run_go_tests.py cargo -- python3 scripts/rust-port/cli_artifacts_contract.py --rust "$rust_binary" --receipt native-cli-artifacts.json --captured-output native-cli-go-artifacts.json --require-native-shells
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('native-cli-artifacts.json').read_text())
          assert receipt['passed'] and receipt['candidate_worktree_clean']
          assert receipt['candidate_commit'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert receipt['actual_counts'] == {'help_pages':140,'scripts':8,'manuals':119,'actual_cli_queries':503}
          assert len(receipt['go_protocol_observations']) == 537
          assert sum(row['name'].startswith('parser/') for row in receipt['go_protocol_observations']) == 82
          assert sum('-quoted-' in row['name'] for row in receipt['go_protocol_observations']) == 18
          expected = {'bash','powershell'} if receipt['native_os'] == 'Windows' else {'bash','zsh','fish'}
          assert expected <= receipt['actual_shells'].keys()
          PY
          go run ./scripts/rust-port/cmd/cligap --binary "$rust_binary" --output target/native-cli-artifact-gaps.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('target/native-cli-artifact-gaps.json').read_text())
          assert report['oracle_paths'] >= 134 and report['rust_paths'] >= 100
          assert not report['missing_paths'], 'every Go help path must be reachable'
          PY
      - name: "[CLI artifacts] Upload actual native observations"
        id: "cli_artifacts-5"
        if: "${{ !cancelled() && needs.select.outputs.cli_artifacts != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "cli-artifacts-macos-latest"
          path: "native-cli-artifacts.json\nnative-cli-go-artifacts.json\ntarget/native-cli-artifact-gaps.json\ntarget/native-go-manual-tests.txt\ntarget/cli-artifacts-captures/\ntarget/cli-artifacts-failures/\n"
          if-no-files-found: "error"
          retention-days: 14
        env:
          GOWORK: "off"
          RUSTUP_TOOLCHAIN: "1.98.0"
          SYMVAULT_TEST_KEYRING: "memory"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
          HOMEBREW_NO_AUTO_UPDATE: "1"
      - name: "[CLI artifacts] reset worktree between satellites"
        id: "reset-cli_artifacts"
        if: "${{ !cancelled() && needs.select.outputs.cli_artifacts != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
