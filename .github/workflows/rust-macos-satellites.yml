name: Rust PR macOS satellites

# Consolidates the PR-triggered macOS satellites that are NOT in the HTTP family
# (rust-http-macos.yml) into three GitHub-hosted xcode-27 jobs, grouped by shared
# crate graph / job environment:
#   macos-mcp     : rust-mcp-process, rust-mcp-http-process, mcp-http-shutdown
#   macos-broker  : rust-broker-connect, rust-broker-egress
#   macos-rest    : cli-artifacts, intake-cli, serve-cli, api-transport, kdf-resource-policy,
#                   vault-read-resource-policy, store-observations, sync-observations, audit
# Each satellite's commands are copied verbatim from its original workflow at
# 895b1fe7 (scripts/ci_macos_satellites_baseline.json). The original workflows keep their
# ubuntu/windows legs on pull_request and keep their macOS legs for push, schedule and
# workflow_dispatch. The Linux select job decides per satellite; a group runs unless
# every member is explicitly selected 'false' (fail-closed: missing/failed selector runs all).
# rust-pairing.yml and rust-tui.yml keep their own macOS jobs.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select PR macOS satellites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      mcp_process: ${{ steps.select.outputs.mcp_process }}
      mcp_http_process: ${{ steps.select.outputs.mcp_http_process }}
      mcp_http_shutdown: ${{ steps.select.outputs.mcp_http_shutdown }}
      broker_connect: ${{ steps.select.outputs.broker_connect }}
      broker_egress: ${{ steps.select.outputs.broker_egress }}
      audit: ${{ steps.select.outputs.audit }}
      api_transport: ${{ steps.select.outputs.api_transport }}
      cli_artifacts: ${{ steps.select.outputs.cli_artifacts }}
      intake_cli: ${{ steps.select.outputs.intake_cli }}
      serve_cli: ${{ steps.select.outputs.serve_cli }}
      kdf_policy: ${{ steps.select.outputs.kdf_policy }}
      vault_read_policy: ${{ steps.select.outputs.vault_read_policy }}
      store_observations: ${{ steps.select.outputs.store_observations }}
      sync_observations: ${{ steps.select.outputs.sync_observations }}
      group_mcp: ${{ steps.select.outputs.group_mcp }}
      group_broker: ${{ steps.select.outputs.group_broker }}
      group_rest: ${{ steps.select.outputs.group_rest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify selector unit and structural checks
        shell: bash
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/macos-satellite-checks"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check 'PyYAML==6.0.3'
          "$venv/bin/python" -B scripts/test_ci_macos_satellites.py
      - name: Select satellites from the diff (fail-closed)
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          python3 -B scripts/ci_macos_satellites.py select --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT" || {
            # Fail closed: if the selector itself cannot run, every satellite and group runs.
            echo 'selector failed; selecting all satellites' >&2
            printf 'any=true\n' >> "$GITHUB_OUTPUT"
            for k in mcp_process mcp_http_process mcp_http_shutdown broker_connect broker_egress audit api_transport cli_artifacts intake_cli serve_cli kdf_policy vault_read_policy store_observations sync_observations group_mcp group_broker group_rest; do printf '%s=true\n' "$k" >> "$GITHUB_OUTPUT"; done
          }
  macos-mcp:
    name: MCP satellites (macos-latest)
    needs: select
    if: ${{ !cancelled() && (needs.select.result != 'success' || needs.select.outputs.group_mcp != 'false') }}
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: "go1.26.10"
      GOWORK: "off"
      RUSTUP_TOOLCHAIN: "1.98.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: "Assert actual native macOS arm64"
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Set up pinned Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: "Install pinned Rust"
        run: |-
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: "Shared prologue complete"
        id: "prologue"
        run: |-
          echo 'shared macOS prologue complete'
      - name: "[MCP process] Set up pinned Python"
        id: "mcp_process-1"
        if: "${{ !cancelled() && needs.select.outputs.mcp_process != 'false' && steps.prologue.outcome == 'success' }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
      - name: "[MCP process] Check narrow diagnostic and receipt evidence boundaries"
        id: "mcp_process-2"
        if: "${{ !cancelled() && needs.select.outputs.mcp_process != 'false' && steps.mcp_process-1.outcome == 'success' }}"
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 scripts/rust-port/test_mcp_oracle.py
          python3 - <<'PY'
          import ast, json, os, runpy, subprocess, tempfile
          from pathlib import Path
          from types import SimpleNamespace
          module = runpy.run_path('scripts/rust-port/mcp_process_contract.py')
          plain = '2026/10/05 01:24:19 WARN anomaly detected type=off_hours severity=low agent=fixture description="Entry access during off-hours by agent fixture"'
          contextual = plain.replace(' description=', ' path=public/fixture request_id=0000000000000001 description=')
          def check(line, implementation='go'):
              module['protocol_bytes'](SimpleNamespace(stdout=b'', stderr=(line+'\n').encode()), Path('__HOME__'), 'diagnostic-unit-control', implementation, 'fixture')
          for line in [plain, contextual, contextual.replace('public/fixture', 'public/missing')]:
              check(line)
          for line, implementation in [(contextual.replace('severity=low', 'severity=high'), 'go'), (contextual.replace('type=off_hours', 'type=tool_chain'), 'go'), (contextual.replace('agent=fixture', 'agent=other'), 'go'), (contextual.replace('public/fixture', 'private/other'), 'go'), (contextual.replace('0000000000000001', 'invalid'), 'go'), (plain+'\naudit log write failed err="audit logger is closed"', 'go'), (contextual, 'rust')]:
              try:
                  check(line, implementation)
              except AssertionError:
                  pass
              else:
                  raise AssertionError('unexpected diagnostic accepted')
          tree = ast.parse(Path('scripts/rust-port/mcp_process_contract.py').read_text())
          main = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name=='main')
          final = next(n for n in main.body if isinstance(n, ast.Try)).finalbody
          code = compile(ast.Module(body=final, type_ignores=[]), '<actual receipt finalization>', 'exec')
          env = {k:v for k,v in os.environ.items() if not k.startswith('GIT_')}
          for location, expected_clean in [('target/control.json', True), ('root-control.json', False)]:
              with tempfile.TemporaryDirectory() as raw:
                  root = Path(raw)
                  subprocess.run(['git','init','-q',str(root)], env=env, check=True)
                  (root/'.git/info/exclude').write_text('target/\n')
                  receipt_path = root/location
                  receipt_path.parent.mkdir(parents=True, exist_ok=True)
                  # Algorithm unit state only, never native process observations.
                  receipt = {'passed':True, 'candidate_worktree_clean':True}
                  scope = {'args':SimpleNamespace(receipt=receipt_path, allow_dirty_for_development=False), 'json':json, 'receipt':receipt, 'checked':lambda args:subprocess.check_output(args, cwd=root, env=env)}
                  rejected = False
                  try:
                      exec(code, scope)
                  except AssertionError:
                      rejected = True
                  result = json.loads(receipt_path.read_text())
                  assert result['candidate_worktree_clean_at_end']==expected_clean
                  assert result['passed']==expected_clean and rejected!=expected_clean
          print('PASS narrow diagnostic and post-output receipt unit controls')
          PY
      - name: "[MCP process] Execute corrected approval generator on both references with race regressions"
        id: "mcp_process-3"
        if: "${{ !cancelled() && needs.select.outputs.mcp_process != 'false' && steps.mcp_process-2.outcome == 'success' }}"
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
          SYMVAULT_TEST_KEYRING: "memory"
        run: |-
          make mcp-ordered-fixtures-check
      - name: "[MCP process] Test the owning runtime and production CLI assembly"
        id: "mcp_process-4"
        if: "${{ !cancelled() && needs.select.outputs.mcp_process != 'false' && steps.mcp_process-3.outcome == 'success' }}"
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          # Keep raw stderr separate from libtest's named verdicts.
          if cargo test -p symvault-mcp --all-targets --locked > target/native-mcp-tests.txt 2> target/native-mcp-tests.stderr.txt; then
            cargo_test_status=0
          else
            cargo_test_status=$?
          fi
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.stdout.write(Path('target/native-mcp-tests.txt').read_text())
          sys.stderr.write(Path('target/native-mcp-tests.stderr.txt').read_text())
          PY
          if [[ "$cargo_test_status" -ne 0 ]]; then
            exit "$cargo_test_status"
          fi
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('target/native-mcp-tests.txt').read_text()
          results = re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored', text)
          # Two existing host-specific tests are Unix-only: symlink template
          # rejection and clipboard signal clearing. The stdio and HTTP
          # regressions below must execute on every OS.
          expected_count = 241 if os.environ['RUNNER_OS']=='Windows' else 243
          assert results and sum(int(n) for n,_ in results)==expected_count
          assert all(int(ignored)==0 for _,ignored in results)
          for case in ['tier_overrides_never_reach_handlers_or_storage', 'explicit_operator_allowlist_restricts_discovery_and_direct_calls', 'command_capability_denial_preserves_rpc_error_without_dispatch', 'oversized_stdio_frame_is_drained_with_bounded_storage', 'exact_frame_limit_is_accepted_and_next_request_recovers_after_oversize', 'oversized_unterminated_fragment_keeps_the_eof_contract', 'public_http_adapter_bounds_oversized_json_before_deserialization', 'nonmcp_oversized_prefixes_preserve_accepted_main_wire_response', 'oversized_body_errors_follow_admission_without_creating_sessions', 'cancelled_stdio_answers_the_frame_it_was_blocked_on_then_stops', 'stdio_cancelled_before_the_first_read_answers_nothing']:
              assert f'{case} ... ok' in text
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked api_template_fixture > target/native-mcp-cli-tests.txt 2> target/native-mcp-cli-tests.stderr
          cat target/native-mcp-cli-tests.txt
          cat target/native-mcp-cli-tests.stderr
          python3 - <<'PY'
          from pathlib import Path
          text = Path('target/native-mcp-cli-tests.txt').read_text()
          assert 'test result: ok. 2 passed; 0 failed; 0 ignored;' in text
          for case in ['cli_runtime_executes_source_bound_api_template_fixture', 'api_template_fixture_slow_setup_preserves_serving_budget']:
              assert f'test {case} ... ok' in text
          PY
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[MCP process] Execute actual Go and Rust native profiles and hostile stdio"
        id: "mcp_process-5"
        if: "${{ !cancelled() && needs.select.outputs.mcp_process != 'false' && steps.mcp_process-4.outcome == 'success' }}"
        env:
          GOTOOLCHAIN: "go1.26.6"
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/mcp_process_contract.py --reference mcp-anomaly-ordered-v1 --rust "$rust_cli" --receipt target/native-mcp-process.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('target/native-mcp-process.json').read_bytes())
          assert receipt['reference_contract']=='mcp-anomaly-ordered-v1'
          assert receipt['oracle_commit']=='24acdb08fcc7021262717aa803d72eb8d151c66a'
          assert receipt['compiler']['version']=='go1.26.6'
          assert receipt['passed'] and receipt['candidate_worktree_clean'] and receipt['candidate_worktree_clean_at_end'] and not receipt['differences']
          assert not subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=normal']).strip()
          assert receipt['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert receipt['native_os'] in {'Linux','Darwin','Windows'}
          expected_profiles = {'legacy','tier-read-only','tier-standard','tier-admin','admin-value-hidden','admin-value-visible','standard-command-override','readonly-capability-overrides','admin-command-disabled','admin-tools-health-only','admin-tools-self-only','admin-api-explicit','standard-no-value-capabilities','builtin-default','builtin-claude-code','builtin-codex','builtin-hermes','builtin-openclaw','builtin-opencode','tier-read-only-real-child','tier-standard-real-child','tier-admin-real-child'}
          expected_hostile = {'unterminated','crlf','blank-line','null-frame','nul-byte','two-objects-one-line','duplicate-envelope-id','frame-exact-limit','frame-over-limit','unterminated-over-limit','depth-10000','depth-10001'}
          assert set(receipt['loaded_go_profiles'])==set(receipt['fixture_snapshots'])==expected_profiles
          for implementation in ['go','rust']:
              rows = receipt[implementation]
              assert len(rows)==22 and {row['case'] for row in rows}==expected_profiles
              assert all(row['response_count']==22 and row['stdout_is_only_protocol'] for row in rows)
              rows = receipt[implementation+'_hostile']
              assert len(rows)==12 and {row['case'] for row in rows}==expected_hostile
              assert all(row['stdout_is_only_protocol'] for row in rows)
          expected_differences = 72 if receipt['native_os']=='Windows' else 67
          assert len(receipt['declared_differences'])==expected_differences
          windows_denials = [row for row in receipt['declared_differences'] if row['decision']=='windows-headless-approval-denial']
          assert len(windows_denials)==(5 if receipt['native_os']=='Windows' else 0)
          assert sum(len(row['frames']) for name in ['go','rust','go_hostile','rust_hostile'] for row in receipt[name])==1022
          PY
      - name: "[MCP process] Upload complete actual native observations"
        id: "mcp_process-6"
        if: "${{ !cancelled() && needs.select.outputs.mcp_process != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "mcp-process-macos-latest"
          path: "target/native-mcp-process.json\ntarget/native-mcp-tests.txt\ntarget/native-mcp-tests.stderr.txt\ntarget/native-mcp-cli-tests.txt\ntarget/native-mcp-cli-tests.stderr\ntarget/mcp-fixture-evidence/\n"
          if-no-files-found: "error"
          retention-days: 14
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
      - name: "[MCP process] reset worktree between satellites"
        id: "reset-mcp_process"
        if: "${{ !cancelled() && needs.select.outputs.mcp_process != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[MCP HTTP process] Set up pinned Python"
        id: "mcp_http_process-1"
        if: "${{ !cancelled() && needs.select.outputs.mcp_http_process != 'false' && steps.prologue.outcome == 'success' }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
      - name: "[MCP HTTP process] Test owning runtime and production CLI assembly"
        id: "mcp_http_process-2"
        if: "${{ !cancelled() && needs.select.outputs.mcp_http_process != 'false' && steps.mcp_http_process-1.outcome == 'success' }}"
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          cargo fmt --all --check
          python3 scripts/rust-port/test_http_process_contract.py
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-http-tests.txt 2>&1
          cat target/native-http-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          log=Path('target/native-http-tests.txt').read_text()
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',log)
          assert results and sum(int(n) for n,_ in results)==(241 if os.environ['RUNNER_OS']=='Windows' else 243)
          assert all(int(ignored)==0 for _,ignored in results)
          assert 'test http::tests::oversized_body_errors_follow_admission_without_creating_sessions ... ok' in log
          assert 'test http::tests::nonmcp_oversized_prefixes_preserve_accepted_main_wire_response ... ok' in log
          assert 'test http::tests::public_http_adapter_bounds_oversized_json_before_deserialization ... ok' in log
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: "[MCP HTTP process] Observe actual native HTTP bytes and stalled clients"
        id: "mcp_http_process-3"
        if: "${{ !cancelled() && needs.select.outputs.mcp_http_process != 'false' && steps.mcp_http_process-2.outcome == 'success' }}"
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-http-process.json
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/rust-port')
          from http_process_contract import EARLY_INVALID_ADMISSION_CASES, validate_stalled_observations
          receipt=json.loads(Path('target/native-http-process.json').read_bytes())
          assert receipt['passed'] and receipt['candidate_worktree_clean'] and receipt['candidate_worktree_clean_at_end'] and not receipt['differences']
          assert not subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=normal']).strip()
          assert receipt['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert receipt['native_os'] in {'Linux','Darwin','Windows'}
          decisions={'token-session-isolation','complete-json-body-required','valid-utf8-required','metadata-fresh-marker-semantic-control'}
          assert len(receipt['declared_differences'])==4 and {r['decision'] for r in receipt['declared_differences']}==decisions
          for implementation in ['go','rust']:
              rows=receipt[implementation]
              assert len(rows)==65 and len({r['case'] for r in rows})==65
              assert {'resource-discovery-head','authorization-discovery-head','oauth-authorize-invalid-head','oauth-authorize-foreign-origin-head','mcp-early-invalid-oversized-invalid-byte','mcp-early-invalid-oversized-invalid-object'}<={r['case'] for r in rows}
              assert {'mcp-early-invalid-oversized-'+name for name,_,_ in EARLY_INVALID_ADMISSION_CASES}<={r['case'] for r in rows}
              assert rows[-1]['case']=='mcp-ping-after-stalled-clients'
              assert all({'status_line','headers','body_base64','wire_body_base64','raw_base64'}<=r['response'].keys() for r in rows)
              assert {r['case'] for r in receipt[implementation+'_startup_denials']}=={'eof','no','blank','not-affirmative','unterminated-yes'}
              assert {r['case'] for r in receipt[implementation+'_stalled_clients']}=={'idle-before-request','incomplete-request-body'}
              assert receipt[implementation+'_process']['forced_cleanup_not_graceful_evidence']
          assert receipt['go_startup_denials']==receipt['rust_startup_denials']
          validate_stalled_observations(receipt)
          PY
      - name: "[MCP HTTP process] Upload complete actual native observations"
        id: "mcp_http_process-4"
        if: "${{ !cancelled() && needs.select.outputs.mcp_http_process != 'false' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: "http-process-macos-latest"
          path: "target/native-http-process.json\ntarget/native-http-tests.txt\n"
          if-no-files-found: "error"
          retention-days: 14
        env:
          RUST_TEST_THREADS: "1"
          TZ: "UTC"
          PYTHONDONTWRITEBYTECODE: "1"
      - name: "[MCP HTTP process] reset worktree between satellites"
        id: "reset-mcp_http_process"
        if: "${{ !cancelled() && needs.select.outputs.mcp_http_process != 'false' }}"
        run: |
          set -euo pipefail
          top="$(git rev-parse --show-toplevel)"
          git worktree list --porcelain | awk '/^worktree /{print substr($0,10)}' | while IFS= read -r wt; do
            if [[ "$wt" != "$top" ]]; then git worktree remove --force "$wt" || true; fi
          done
          git worktree prune
          git checkout --quiet -- .
          git clean -fd --quiet
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
      - name: "[HTTP lifecycle] Set up pinned Python"
        id: "mcp_http_shutdown-1"
        if: "${{ !cancelled() && needs.select.outputs.mcp_http_shutdown != 'false' && steps.prologue.outcome == 'success' }}"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
        env:
          SYMVAULT_RUN_WINDOWS_CROSSLANG: "1"
          SYMVAULT_TEST_KEYRING: "memory"
      - name: "[HTTP lifecycle] Execute owning race tests and existing auth/OAuth/mTLS contracts"
        id: "mcp_http_shutdown-2"
        if: "${{ !cancelled() && needs.select.outputs.mcp_http_shutdown != 'false' && steps.mcp_http_shutdown-1.outcome == 'success' }}"
        env:
