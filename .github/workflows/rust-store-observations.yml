name: Store oracle observations

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-store-observations.yml'
      - 'scripts/rust-port/cmd/storegen/**'
      - 'testdata/port/store/store.json'
      - 'docs/rust-port/store-normalization.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-store-observations.yml'
      - 'scripts/rust-port/cmd/storegen/**'
      - 'testdata/port/store/store.json'
      - 'docs/rust-port/store-normalization.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observations:
    name: Store observations (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout immutable oracle history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: true
      - name: Repeat real captures and reject semantic drift
        run: |
          set -euo pipefail
          go test -race ./scripts/rust-port/cmd/storegen -count=1 -json > store-observations.jsonl
          python3 -c 'import json; rows=[json.loads(line) for line in open("store-observations.jsonl")]; required={"TestRepeatedPinnedStoreObservationsHaveStableProjection","TestClockProjectionPreservesOtherJSONBytes"}; passed={r.get("Test") for r in rows if r.get("Action")=="pass"}; assert required <= passed, required-passed; assert not any(r.get("Action")=="skip" and r.get("Test") in required for r in rows); print("Verified real repeated-capture and byte-preservation controls executed")'
          go run ./scripts/rust-port/cmd/storegen --check --output testdata/port/store/store.json
      - name: Upload native observation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-observations-${{ matrix.os }}
          path: store-observations.jsonl
          if-no-files-found: error
          retention-days: 14
