name: Rust MCP native process contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-mcp-process.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'internal/mcp/apitemplates/builtin/**'
      - 'scripts/rust-port/mcp_process*'
      - 'docs/adr/0016-mcp-discovery-and-call-authorization.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-process:
    name: MCP process (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test the owning runtime and production CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-mcp-tests.txt 2>&1
          cat target/native-mcp-tests.txt
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('target/native-mcp-tests.txt').read_text()
          results = re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored', text)
          # Two existing host-specific tests are Unix-only: symlink template
          # rejection and clipboard signal clearing. All six new regressions
          # below must execute on every OS.
          expected_count = 227 if os.environ['RUNNER_OS']=='Windows' else 229
          assert results and sum(int(n) for n,_ in results)==expected_count
          assert all(int(ignored)==0 for _,ignored in results)
          for case in ['tier_overrides_never_reach_handlers_or_storage', 'explicit_operator_allowlist_restricts_discovery_and_direct_calls', 'command_capability_denial_preserves_rpc_error_without_dispatch', 'oversized_stdio_frame_is_drained_with_bounded_storage', 'exact_frame_limit_is_accepted_and_next_request_recovers_after_oversize', 'oversized_unterminated_fragment_keeps_the_eof_contract']:
              assert f'{case} ... ok' in text
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Execute actual Go and Rust native profiles and hostile stdio
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/mcp_process_contract.py --rust "$rust_cli" --receipt native-mcp-process.json
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          receipt = json.loads(Path('native-mcp-process.json').read_bytes())
          assert receipt['passed'] and receipt['candidate_worktree_clean'] and not receipt['differences']
          assert receipt['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert receipt['native_os'] in {'Linux','Darwin','Windows'}
          expected_profiles = {'legacy','tier-read-only','tier-standard','tier-admin','admin-value-hidden','admin-value-visible','standard-command-override','readonly-capability-overrides','admin-command-disabled','admin-tools-health-only','admin-tools-self-only','admin-api-explicit','standard-no-value-capabilities','builtin-default','builtin-claude-code','builtin-codex','builtin-hermes','builtin-openclaw','builtin-opencode','tier-read-only-real-child','tier-standard-real-child','tier-admin-real-child'}
          expected_hostile = {'unterminated','crlf','blank-line','null-frame','nul-byte','two-objects-one-line','duplicate-envelope-id','frame-exact-limit','frame-over-limit','unterminated-over-limit','depth-10000','depth-10001'}
          assert set(receipt['loaded_go_profiles'])==set(receipt['fixture_snapshots'])==expected_profiles
          for implementation in ['go','rust']:
              rows = receipt[implementation]
              assert len(rows)==22 and {row['case'] for row in rows}==expected_profiles
              assert all(row['response_count']==22 and row['stdout_is_only_protocol'] for row in rows)
              rows = receipt[implementation+'_hostile']
              assert len(rows)==12 and {row['case'] for row in rows}==expected_hostile
              assert all(row['stdout_is_only_protocol'] for row in rows)
          expected_differences = 72 if receipt['native_os']=='Windows' else 67
          assert len(receipt['declared_differences'])==expected_differences
          windows_denials = [row for row in receipt['declared_differences'] if row['decision']=='windows-headless-approval-denial']
          assert len(windows_denials)==(5 if receipt['native_os']=='Windows' else 0)
          assert sum(len(row['frames']) for name in ['go','rust','go_hostile','rust_hostile'] for row in receipt[name])==1022
          PY
      - name: Upload complete actual native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-process-${{ matrix.os }}
          path: |
            native-mcp-process.json
            target/native-mcp-tests.txt
          if-no-files-found: error
          retention-days: 14
