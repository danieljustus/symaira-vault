name: Rust MCP native process contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-mcp-process.yml'
      - 'Makefile'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.gitattributes'
      - 'testdata/**'
      - 'third_party/**'
      - 'scripts/rust-port/mcp_process*'
      - 'scripts/rust-port/mcp_oracle.py'
      - 'scripts/rust-port/mcp_fixture_contract.py'
      - 'scripts/rust-port/test_mcp_oracle.py'
      - 'scripts/rust-port/fixtures/mcp-anomaly/**'
      - 'docs/adr/0016-mcp-discovery-and-call-authorization.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-process:
    name: MCP process (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      RUST_TEST_THREADS: '1'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout candidate and frozen observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check narrow diagnostic and receipt evidence boundaries
        run: |
          python3 scripts/rust-port/test_mcp_oracle.py
          python3 scripts/rust-port/test_mcp_process_contract.py
      - name: Execute corrected approval generator on both references with race regressions
        env:
          SYMVAULT_TEST_KEYRING: memory
        run: make mcp-ordered-fixtures-check
      - name: Test the owning runtime and production CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          # Keep raw stderr separate from libtest's named verdicts.
          if cargo test -p symvault-mcp --all-targets --locked > target/native-mcp-tests.txt 2> target/native-mcp-tests.stderr.txt; then
            cargo_test_status=0
          else
            cargo_test_status=$?
          fi
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.stdout.write(Path('target/native-mcp-tests.txt').read_text())
          sys.stderr.write(Path('target/native-mcp-tests.stderr.txt').read_text())
          PY
          if [[ "$cargo_test_status" -ne 0 ]]; then
            exit "$cargo_test_status"
          fi
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-mcp-tests.txt tier_overrides_never_reach_handlers_or_storage explicit_operator_allowlist_restricts_discovery_and_direct_calls command_capability_denial_preserves_rpc_error_without_dispatch oversized_stdio_frame_is_drained_with_bounded_storage exact_frame_limit_is_accepted_and_next_request_recovers_after_oversize oversized_unterminated_fragment_keeps_the_eof_contract public_http_adapter_bounds_oversized_json_before_deserialization nonmcp_oversized_prefixes_preserve_accepted_main_wire_response oversized_body_errors_follow_admission_without_creating_sessions cancelled_stdio_answers_the_frame_it_was_blocked_on_then_stops stdio_cancelled_before_the_first_read_answers_nothing --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --test mcp_commands_contract --locked api_template_fixture > target/native-mcp-cli-tests.txt 2> target/native-mcp-cli-tests.stderr
          cat target/native-mcp-cli-tests.txt
          cat target/native-mcp-cli-tests.stderr
          python3 - <<'PY'
          from pathlib import Path
          text = Path('target/native-mcp-cli-tests.txt').read_text()
          assert 'test result: ok. 2 passed; 0 failed; 0 ignored;' in text
          for case in ['cli_runtime_executes_source_bound_api_template_fixture', 'api_template_fixture_slow_setup_preserves_serving_budget']:
              assert f'test {case} ... ok' in text
          PY
          cargo build -p symvault-cli --bin symvault --locked
      - name: Execute actual Go and Rust native profiles and hostile stdio
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/mcp_process_contract.py --reference mcp-anomaly-ordered-v1 --rust "$rust_cli" --receipt target/native-mcp-process.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-mcp-process.json --profile mcp-process
      - name: Upload complete actual native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mcp-process-${{ matrix.os }}
          path: |
            target/native-mcp-process.json
            target/native-mcp-tests.txt
            target/native-mcp-tests.stderr.txt
            target/native-mcp-cli-tests.txt
            target/native-mcp-cli-tests.stderr
            target/mcp-fixture-evidence/
          if-no-files-found: error
          retention-days: 14
