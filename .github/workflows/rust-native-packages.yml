name: Rust Linux native packages

on:
  push:
    branches: [ main ]
    paths:
      - '.goreleaser.yml'
      - '.github/workflows/rust-native-packages.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/rust-port/native_packages.py'
  pull_request:
    branches: [ main ]
    paths:
      - '.goreleaser.yml'
      - '.github/workflows/rust-native-packages.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/rust-port/native_packages.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.6
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  package:
    name: Unsigned ${{ matrix.arch }} DEB/RPM/APK
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm python3-yaml
          python3 -c 'import yaml'

      - name: Set up pinned Go for nfpm
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache: false

      - name: Install pinned nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain and target
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add '${{ matrix.target }}'

      - name: Build Rust CLI for Linux ${{ matrix.arch }}
        run: |
          cargo build --release --locked -p symvault-cli --bin symvault --target '${{ matrix.target }}'
          echo "RUST_BINARY=target/${{ matrix.target }}/release/symvault" >> "$GITHUB_ENV"

      - name: Stage and compare unsigned packages
        run: |
          python3 scripts/rust-port/native_packages.py stage \
            --binary "$RUST_BINARY" --output dist/rust-native-packages \
            --arch '${{ matrix.arch }}'
          for package in dist/rust-native-packages/*; do
            python3 scripts/rust-port/native_packages.py verify \
              --package "$package" --arch '${{ matrix.arch }}'
          done
