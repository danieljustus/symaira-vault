name: Rust live TLS and mTLS contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-http-tls.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'internal/mcp/apitemplates/builtin/**'
      - 'scripts/rust-port/http_head_contract.py'
      - 'scripts/rust-port/http_framing_contract.py'
      - 'scripts/rust-port/http_origin_contract.py'
      - 'scripts/rust-port/http_tls*'
      - 'scripts/rust-port/http_oauth*'
      - 'scripts/rust-port/http_process*'
      - 'scripts/rust-port/mcp_process_contract.py'
      - 'docs/adr/0025-live-tls-and-client-identity-proof.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tls:
    name: Live TLS/mTLS (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test owning runtime and CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-tls-tests.txt 2>&1
          cat target/native-tls-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('target/native-tls-tests.txt').read_text()
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert results and sum(int(n) for n,_ in results)==(227 if os.environ['RUNNER_OS']=='Windows' else 229)
          assert all(int(ignored)==0 for _,ignored in results)
          assert 'mtls_listener_requires_valid_client_certificate ... ok' in text
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Execute actual native verified TLS and mTLS controls
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_tls_contract.py --rust "$rust_cli" --receipt target/native-http-tls.json
          python3 - <<'CHECK'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('target/native-http-tls.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and r['candidate_worktree_clean_at_end']
          assert r['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['native_os'] in {'Linux','Darwin','Windows'} and not r['differences']
          assert len(r['declared_differences'])==20
          assert {d['decision'] for d in r['declared_differences']}=={'https-discovery-on-tls','secure-origin-matches-http-authority'}
          for implementation in ['go','rust']:
              assert set(r[implementation])=={'tls12','tls13','mtls12','mtls13'}
              assert sum(len(p['rows']) for p in r[implementation].values())==48
              assert sum(len(p['identity_controls']) for p in r[implementation].values())==12
              assert sum(len(p['encrypted_peers']) for p in r[implementation].values())==8
              for name,observed in r[implementation].items():
                  assert len(observed['rows'])==12 and len({x['case'] for x in observed['rows']})==12
                  assert len(observed['processes'])==1
                  assert all(p['output_capture_complete'] and not p['output_capture_errors'] and p['forced_cleanup_not_graceful_evidence'] for p in observed['processes'])
                  assert observed['control_workers_joined'] and not observed['control_errors']
                  assert all(p['rejected'] for p in observed['identity_controls'])
                  assert len(observed['encrypted_peers'])==2
                  for peer in observed['encrypted_peers']:
                      assert peer['sender_joined'] and peer['peer_terminal_observed'] and not peer['forced_client_close']
                      assert peer['sent_record_bytes']>=4 and peer['sent_record_bytes']<peer['record_length']
                      assert peer['server_certificate_sha256']==r['server_certificate_sha256']
                      assert peer['tls_version']==('TLSv1.2' if name.endswith('12') else 'TLSv1.3')
                      assert peer['termination'] in {'actual-empty-eof-or-reset','complete-go-json-error-before-write-deadline'}
                  assert observed['rows'][-1]['case']=='recovery-ping'
                  assert observed['rows'][-1]['response']['status_line']=='HTTP/1.1 200 OK'
          CHECK
      - name: Retain complete actual native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: http-tls-${{ matrix.os }}
          path: |
            target/native-http-tls.json
            target/native-tls-tests.txt
          if-no-files-found: error
