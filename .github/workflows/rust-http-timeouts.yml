name: Rust configured HTTP input deadlines

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-http-timeouts.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'internal/mcp/apitemplates/builtin/**'
      - 'scripts/rust-port/http_head_contract.py'
      - 'scripts/rust-port/http_framing_contract.py'
      - 'scripts/rust-port/http_slow_peer_contract.py'
      - 'scripts/rust-port/http_timeout_contract.py'
      - 'scripts/rust-port/http_oauth*'
      - 'scripts/rust-port/http_process*'
      - 'scripts/rust-port/mcp_process_contract.py'
      - 'docs/adr/0026-http-transport-timeout-options.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timeout:
    name: Configured HTTP deadlines (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test owning runtime and CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-core --all-targets --locked > target/native-timeout-core-tests.txt 2>&1
          cat target/native-timeout-core-tests.txt
          cargo test -p symvault-mcp --all-targets --locked > target/native-timeout-tests.txt 2>&1
          cat target/native-timeout-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('target/native-timeout-tests.txt').read_text()
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert results and sum(int(n) for n,_ in results)==(234 if os.environ['RUNNER_OS']=='Windows' else 236)
          assert all(int(ignored)==0 for _,ignored in results)
          core=Path('target/native-timeout-core-tests.txt').read_text()
          core_results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',core)
          assert core_results and sum(int(n) for n,_ in core_results)>0
          assert all(int(ignored)==0 for _,ignored in core_results)
          assert 'keep_alive_idle_timeout_matches_go_source_and_closes_socket ... ok' in text
          PY
          cargo test -p symvault-cli --bin symvault --locked mcp_commands::tests > target/native-timeout-cli-owner.txt 2>&1
          cat target/native-timeout-cli-owner.txt
          python3 - <<'OWNER'
          import re
          from pathlib import Path
          text=Path('target/native-timeout-cli-owner.txt').read_text()
          rows=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert rows and sum(int(n) for n,_ in rows)>0 and all(int(i)==0 for _,i in rows)
          OWNER
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Execute actual native configured read deadlines and default fallbacks
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_timeout_contract.py --rust "$rust_cli" --receipt target/native-http-timeouts.json
          python3 - <<'CHECK'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('target/native-http-timeouts.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and r['candidate_worktree_clean_at_end']
          assert r['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['native_os'] in {'Linux','Darwin','Windows'} and not r['differences'] and not r['declared_differences']
          assert set(r['profiles'])=={'positive','zero','negative'}
          for implementation in ['go','rust']:
              assert len(r['invalid_config'][implementation])==2
              for row in r['invalid_config'][implementation]:
                  assert row['exit']==row['expected_exit']==(6 if implementation=='go' else 1)
                  assert not row['forced_cleanup'] and row['output_capture_complete'] and not row['output_capture_errors']

          for implementation in ['go','rust']:
              assert set(r[implementation])=={'positive','zero','negative'}
              assert sum(len(p['rows']) for p in r[implementation].values())==9
              assert sum(len(p['slow_peers']) for p in r[implementation].values())==6
              for profile,observed in r[implementation].items():
                  assert len(observed['rows'])==3 and len(observed['processes'])==1
                  assert all(p['output_capture_complete'] and not p['output_capture_errors'] and p['forced_cleanup_not_graceful_evidence'] for p in observed['processes'])
                  assert observed['workers_joined'] and not observed['control_errors']
                  assert len(observed['slow_peers'])==2
                  for peer in observed['slow_peers']:
                      assert peer['sender_joined'] and peer['peer_terminal_observed'] and not peer['forced_client_close']
                      assert peer['sent_progress_bytes']>=4
                      assert peer['termination'] in {'actual-empty-eof-or-reset','complete-go-json-error-before-write-deadline'}
                  assert observed['idle_boundary']['idle_wait_seconds']>=6
                  assert len(observed['idle_boundary']['responses'])==2
                  assert observed['rows'][-1]['case']=='ping-after'
                  assert observed['rows'][-1]['response']['status_line']=='HTTP/1.1 200 OK'
          CHECK
      - name: Retain complete actual native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: http-timeouts-${{ matrix.os }}
          path: |
            target/native-http-timeouts.json
            target/native-timeout-tests.txt
            target/native-timeout-core-tests.txt
            target/native-timeout-cli-owner.txt
          if-no-files-found: error
