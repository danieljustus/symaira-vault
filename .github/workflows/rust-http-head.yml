name: Rust HTTP HEAD contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-http-head.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'scripts/rust-port/http_head_contract.py'
      - 'scripts/rust-port/http_oauth*'
      - 'scripts/rust-port/http_process*'
      - 'scripts/rust-port/mcp_process_contract.py'
      - 'docs/adr/0021-http-head-responses-and-consent.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  head:
    name: HTTP HEAD (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in rust-http-macos.yml as one consolidated GitHub-hosted job.
        os: [ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: '1.98.0'
      RUST_TEST_THREADS: '1'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout candidate and frozen observations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test owning runtime and CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-head-tests.txt 2>&1 || { cat target/native-head-tests.txt; exit 1; }
          cat target/native-head-tests.txt
          python3 scripts/rust-port/gate_area_check.py log-ok target/native-head-tests.txt browser_consent_requires_the_vault_passphrase_before_issuing_a_code --sum-passed "$(make -s print-AREA_MCP_TEST_COUNT)"
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Execute actual native HEAD and persistent response boundaries
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_head_contract.py --rust "$rust_cli" --receipt target/native-http-head.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-http-head.json --profile http-head
      - name: Preserve strict HTTP and actual OAuth corpora
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-head-http-process.json
          python3 scripts/rust-port/http_oauth_contract.py --rust "$rust_cli" --receipt target/native-head-http-oauth.json
          python3 scripts/rust-port/gate_area_check.py receipt target/native-head-http-process.json --profile http-process
          python3 scripts/rust-port/gate_area_check.py receipt target/native-head-http-oauth.json --profile http-oauth
      - name: Retain complete actual native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: http-head-${{ matrix.os }}
          path: |
            target/native-http-head.json
            target/native-head-http-process.json
            target/native-head-http-oauth.json
            target/native-head-tests.txt
          if-no-files-found: error
          retention-days: 14
