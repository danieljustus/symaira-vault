name: Rust HTTP HEAD contracts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-http-head.yml'
      - 'crates/symvault-cli/**'
      - 'crates/symvault-mcp/**'
      - 'crates/symvault-core/**'
      - 'crates/symvault-store/**'
      - 'crates/symvault-platform/**'
      - 'Cargo.lock'
      - 'internal/mcp/apitemplates/builtin/**'
      - 'scripts/rust-port/http_head_contract.py'
      - 'scripts/rust-port/http_oauth*'
      - 'scripts/rust-port/http_process*'
      - 'scripts/rust-port/mcp_process_contract.py'
      - 'docs/adr/0021-http-head-responses-and-consent.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  head:
    name: HTTP HEAD (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: go1.26.6
      GOWORK: 'off'
      RUSTUP_TOOLCHAIN: '1.98.0'
      TZ: UTC
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout retained Go oracle and candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
      - name: Set up pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Test owning runtime and CLI assembly
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy -p symvault-cli -p symvault-mcp --all-targets --all-features --locked -- -D warnings
          cargo test -p symvault-mcp --all-targets --locked > target/native-head-tests.txt 2>&1
          cat target/native-head-tests.txt
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('target/native-head-tests.txt').read_text()
          results=re.findall(r'test result: ok\. (\d+) passed; 0 failed; (\d+) ignored',text)
          assert results and sum(int(n) for n,_ in results)==(238 if os.environ['RUNNER_OS']=='Windows' else 240)
          assert all(int(ignored)==0 for _,ignored in results)
          assert 'browser_consent_requires_the_vault_passphrase_before_issuing_a_code ... ok' in text
          PY
          cargo test -p symvault-cli --test mcp_commands_contract --locked cli_runtime_executes_source_bound_api_template_fixture
          cargo build -p symvault-cli --bin symvault --locked
      - name: Execute actual native HEAD and persistent response boundaries
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_head_contract.py --rust "$rust_cli" --receipt target/native-http-head.json
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          r=json.loads(Path('target/native-http-head.json').read_bytes())
          assert r['passed'] and r['candidate_worktree_clean'] and r['candidate_worktree_clean_at_end']
          assert r['candidate_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert r['native_os'] in {'Linux','Darwin','Windows'} and not r['differences']
          for implementation in ['go','rust']:
              observed=r[implementation]
              assert len(observed['rows'])==13 and len(observed['authorization_heads'])==512
              assert len(observed['pipeline']['responses'])==2
              assert len(observed['processes'])==1
              assert all(p['output_capture_complete'] and not p['output_capture_errors'] and p['forced_cleanup_not_graceful_evidence'] for p in observed['processes'])
              assert observed['browser_control']['status_line']=='HTTP/1.1 200 OK'
          PY
      - name: Preserve strict HTTP and actual OAuth corpora
        run: |
          set -euo pipefail
          rust_cli=target/debug/symvault
          if [[ "$RUNNER_OS" == "Windows" ]]; then rust_cli+=.exe; fi
          python3 scripts/rust-port/http_process_contract.py --rust "$rust_cli" --receipt target/native-head-http-process.json
          python3 scripts/rust-port/http_oauth_contract.py --rust "$rust_cli" --receipt target/native-head-http-oauth.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          http=json.loads(Path('target/native-head-http-process.json').read_bytes())
          oauth=json.loads(Path('target/native-head-http-oauth.json').read_bytes())
          assert all(r['passed'] and r['candidate_worktree_clean'] and not r['differences'] for r in [http,oauth])
          assert len(http['go'])==len(http['rust'])==65 and len(http['declared_differences'])==4
          assert len(oauth['semantic_controls'])==26
          for implementation in ['go','rust']:
              assert len(oauth[implementation]['rows'])==35 and len(oauth[implementation]['ttl_rows'])==11
          PY
      - name: Retain complete actual native observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: http-head-${{ matrix.os }}
          path: |
            target/native-http-head.json
            target/native-head-http-process.json
            target/native-head-http-oauth.json
            target/native-head-tests.txt
          if-no-files-found: error
          retention-days: 14
