name: Rust storage differential

on:
  workflow_dispatch:
  push:
    branches: [main, 'migration/**']
    paths:
      - '.github/workflows/rust-store.yml'
      - 'crates/symvault-store/**'
      - 'crates/symvault-crypto/**'
      - 'testdata/port/store/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  schedule:
    - cron: '45 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.98.0

jobs:
  storage-native:
    name: Storage differential (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-latest' && 'xcode-27' || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Assert actual native macOS arm64
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = macOS
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - name: Test native storage and publication
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo fmt --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" --all --check
          cargo test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p symvault-store --all-targets --all-features --locked
          cargo clippy --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p symvault-store --all-targets --all-features --locked -- -D warnings