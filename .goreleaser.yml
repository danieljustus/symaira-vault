# GoReleaser configuration for Symaira Vault
# Documentation: https://goreleaser.com

version: 2

before:
  hooks:
    # The Rust CLI is the shipped binary (Go CLI retired, ADR in docs/rust-port).
    # Completions and man pages come from the Rust binary's own generators.
    # (Man pages go to dist/, which GoReleaser requires to be empty until the
    # build starts, so they are generated in the first build's pre hook.)
    - env SYMVAULT_VERSION={{ .Version }} make completions
    - >-
      sh -c 'SENSITIVE_FILES="identity.age mcp-token .env coverage coverage.out *.test cmd.test mcp.test vault.test";
      for f in $SENSITIVE_FILES; do
      if [ -e "$f" ]; then
      echo "ERROR: Sensitive file found in project root: $f";
      exit 1;
      fi;
      done;
      if find . -name ".env" -not -path "./.git/*" 2>/dev/null | grep -q .; then
      echo "ERROR: .env file found outside .git - remove before release";
      exit 1;
      fi;
      echo "Secret/artifact gate passed"'

# Both builds compile crates/symvault-cli. SYMVAULT_VERSION is the only stamp the
# Rust CLI reads (option_env! in crates/symvault-cli/src/main.rs); commit/date/
# builtBy have no Rust counterpart. Linux targets are static musl (the Go
# builds were CGO_ENABLED=0) cross-built with cargo-zigbuild; darwin builds
# natively with cargo so the system frameworks resolve against the host SDK.
# Both go through cargo-auditable so syft finds the crate list in the binary.
builds:
  - id: symvault-static
    builder: rust
    binary: symvault
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
    tool: ./scripts/cargo-auditable.sh
    command: zigbuild
    hooks:
      pre:
        - cmd: sh -c 'if [ "{{ .Os }}/{{ .Arch }}" = "linux/amd64" ]; then env SYMVAULT_VERSION={{ .Version }} make release-manpages; fi'
      post:
        - 'scripts/build-mcpb.sh --version "{{ .Version }}" --os "{{ .Os }}" --arch "{{ .Arch }}" --binary "{{ .Path }}"'
    flags:
      - --release
      - --locked
      - -p=symvault-cli
      - --bin=symvault
    env:
      - SYMVAULT_VERSION={{ .Version }}
  - id: symvault-darwin
    builder: rust
    binary: symvault
    targets:
      - aarch64-apple-darwin
    tool: ./scripts/cargo-auditable.sh
    command: build
    flags:
      - --release
      - --locked
      - -p=symvault-cli
      - --bin=symvault
    env:
      - SYMVAULT_VERSION={{ .Version }}
    hooks:
      post:
        - 'scripts/build-mcpb.sh --version "{{ .Version }}" --os "{{ .Os }}" --arch "{{ .Arch }}" --binary "{{ .Path }}"'
        - cmd: sh -c 'if [ -n "${CODESIGN_IDENTITY:-}" ]; then codesign -s "$CODESIGN_IDENTITY" --timestamp --options runtime "{{ .Path }}"; echo "Signed {{ .Path }}"; fi'

# macOS code signing and notarization
# Requires Apple Developer ID (Team ID: M4744F3TAA) and App Store Connect API keys.
# Kept commented out until repository secrets are configured in GitHub Actions:
# - APPLE_DEVELOPER_ID_CERTIFICATE
# - APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD
# - APPLE_API_KEY_ID
# - APPLE_API_ISSUER_ID
# - APPLE_API_KEY_BASE64
# (See docs/macos-notarization.md)
#
# notarize:
#   macos:
#     - enabled: true
#       sign:
#         certificate: "{{ .Env.APPLE_DEVELOPER_ID_CERTIFICATE }}"
#         password: "{{ .Env.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}"
#       issuer_id: "{{ .Env.APPLE_API_ISSUER_ID }}"
#       key_id: "{{ .Env.APPLE_API_KEY_ID }}"
#       key: "{{ .Env.APPLE_API_KEY_BASE64 }}"
#       wait: true
#       timeout: 20m

archives:
  - id: symvault
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - completions/*
      - src: dist/man/*.1
        dst: docs/man
        strip_parent: true
    wrap_in_directory: true

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: "^feat[:\\(]"
      order: 0
    - title: Bug Fixes
      regexp: "^fix[:\\(]"
      order: 1
    - title: Performance Improvements
      regexp: "^perf[:\\(]"
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: "danieljustus"
    name: "symaira-vault"
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"
  header: |
    ## Symaira Vault {{ .Version }}
    
    Symaira Vault is a secure password management CLI tool.
  footer: |
    ## Installation

    ### Quick install (recommended)

    **macOS arm64 / Linux (CLI):**
    ```bash
    curl -sSfL https://raw.githubusercontent.com/danieljustus/symaira-vault/main/scripts/install.sh | sh
    ```

    ### Download
    Download the appropriate binary for your platform from the assets below.

    `symvault` needs the `git` executable at runtime (vault history and sync
    shell out to it). The deb/rpm/apk packages depend on `git`; install it
    yourself when using the archive, install script or Homebrew-less setups
    (macOS: `xcode-select --install` or `brew install git`).

    ### Build from source
    ```bash
    cargo install --locked --git https://github.com/danieljustus/symaira-vault --tag {{ .Tag }} symvault-cli
    ```

# Homebrew: Formula/symvault.rb is rendered by scripts/homebrew-formula.sh and
# opened as a tap PR from release.yml (GoReleaser's `brews` is deprecated).

nfpms:
  - id: symvault
    package_name: symvault
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: danieljustus
    homepage: "https://github.com/danieljustus/symaira-vault"
    maintainer: "danieljustus <88160656+danieljustus@users.noreply.github.com>"
    description: "Secure password management CLI tool"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
      - apk
    # git is a hard runtime dependency of the Rust CLI (it shells out to git;
    # the Go CLI embedded go-git). See docs/adr/0033-git-binary-runtime-dependency.md.
    dependencies:
      - git
    bindir: /usr/bin
    section: utils
    priority: optional


sboms:
  - artifacts: archive
    documents:
      - "${artifact}.sbom.json"
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}"]
    artifacts: all

snapshot:
  version_template: "{{ incpatch .Version }}-next"

dist: dist
