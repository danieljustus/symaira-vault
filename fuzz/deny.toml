# The fuzz crate is an independent Cargo workspace, so it does not inherit
# the repository-level deny.toml automatically. Keep this policy identical to
# ../deny.toml: fuzz dependencies must use the same registry and licenses.
[graph]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = [
  # Scoped exception approved in #1502; delete together with the audit.toml entry.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only via age 0.12.1 -> p256 0.13, used by age tag/tagpq recipients that symvault never constructs; remove when age adopts p256 0.14 (#1502)" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "NCSA",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
