[package]
name = "symvault-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
resolver = "2"

[dependencies]
base64 = "=0.22.1"
libfuzzer-sys = "=0.4.9"
serde_json = "=1.0.151"
symvault-crypto = { path = "../crates/symvault-crypto", version = "=0.0.0" }
symvault-sync = { path = "../crates/symvault-sync", version = "=0.0.0" }

[[bin]]
name = "age_envelope"
path = "fuzz_targets/age_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_csv"
path = "fuzz_targets/import_csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_csv_mapping"
path = "fuzz_targets/import_csv_mapping.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_bitwarden"
path = "fuzz_targets/import_bitwarden.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_1pux"
path = "fuzz_targets/import_1pux.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_cxf"
path = "fuzz_targets/import_cxf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_pass_entry"
path = "fuzz_targets/import_pass_entry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_normalize_path"
path = "fuzz_targets/import_normalize_path.rs"
test = false
