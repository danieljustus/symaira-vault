name: Symvault
options:
  bundleIdPrefix: com.symaira
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.11.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SymvaultClient:
    path: "."

targets:
  Symvault:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "14.0"
    dependencies:
      - package: SymvaultClient
        product: SymvaultFeature
    sources:
      - path: Sources/SymvaultApp
    entitlements:
      path: Symvault.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.vault
        PRODUCT_NAME: Symaira Vault
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Symaira Vault
        INFOPLIST_KEY_CFBundleName: Symaira Vault
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Symvault-Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Credential Intake
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - public.json
              - public.data
              - net.daringfireball.markdown
              - public.jpeg
              - public.png
              - com.adobe.pdf
              - public.certificate
              - public.x509-certificate
              - com.apple.pkcs12
            CFBundleTypeIconFiles: []
    postBuildScripts:
      - name: Embed symvault Engine
        script: |
          SRC="${PROJECT_DIR}/../symvault"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          if [ -f "$SRC" ]; then
            mkdir -p "$DST"
            cp "$SRC" "$DST/symvault"
            chmod +x "$DST/symvault"
            echo "Embedded symvault into $DST/symvault"
          else
            echo "warning: symvault not found at $SRC — run 'make build' first"
          fi
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false

  SymvaultIOS:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    dependencies:
      - package: SymvaultClient
        product: SymvaultFeature
      - sdk: LocalAuthentication.framework
      - sdk: Security.framework
      - sdk: VisionKit.framework
      - sdk: CryptoKit.framework
    sources:
      - path: Sources/SymvaultIOS
    entitlements:
      path: SymvaultIOS.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.symaira.vault.ios
        PRODUCT_NAME: Symaira Vault
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Symaira Vault
        INFOPLIST_KEY_CFBundleName: Symaira Vault
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "Symaira Vault uses the camera to scan a pairing QR code shown on your Mac."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Symaira Vault uses Face ID to unlock your device identity and to confirm approval decisions."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Symaira Vault connects to your Mac on the local network to pair as an approval device and to check for pending approval requests."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
