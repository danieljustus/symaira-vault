[graph]
all-features = true
# Audit the platforms this repository builds and ships. The transitive
# webpki-root-certs data package is only used by rustls on wasm32.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-unknown-freebsd",
  "aarch64-unknown-freebsd",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
]

[advisories]
unmaintained = "workspace"
ignore = [
  # Scoped exception approved in #1502; delete together with the audit.toml entry.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only via age 0.12.1 -> p256 0.13, used by age tag/tagpq recipients that symvault never constructs; remove when age adopts p256 0.14 (#1502)" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/danieljustus/symaira-corekit"]
