[graph]
all-features = true
# Audit the platforms this repository builds and ships. The transitive
# webpki-root-certs data package is only used by rustls on wasm32.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-freebsd",
  "aarch64-unknown-freebsd",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
]

[advisories]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MIT-0",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# ADR 0029: pinned arboard Windows text-clipboard implementation. Boost 1.0
# is permissive; these explicit package/version exceptions preserve the general
# license allowlist and require review when either implementation changes.
[[licenses.exceptions]]
name = "clipboard-win"
version = "=5.4.1"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
version = "=3.4.0"
allow = ["BSL-1.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/danieljustus/symaira-corekit"]
